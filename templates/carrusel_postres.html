<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Postres - La Peña de Marito
    </title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #080604;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        button {
            font-family: inherit;
        }


        .carrusel {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #080604;
        }



        /* =====================================================
           IMAGEN PRINCIPAL
        ===================================================== */

        .imagen-principal {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            opacity: 1;

            transform: scale(1);

            transition:
                opacity 0.8s ease;
        }



        /*
            PRIMER EFECTO:
            aparece primero el postre
        */

        .imagen-principal.animando {

            animation:
                entradaPostre
                7s
                ease-out
                forwards;
        }



        @keyframes entradaPostre {

            0% {

                opacity: 0;

                transform:
                    scale(1.07);
            }


            12% {

                opacity: 1;
            }


            100% {

                opacity: 1;

                transform:
                    scale(1.015);
            }
        }



        /* =====================================================
           SOMBRAS PARA QUE SE LEA BIEN EN EL MONITOR
        ===================================================== */

        .capa-oscura {

            position: absolute;

            inset: 0;

            z-index: 5;

            pointer-events: none;


            background:

                linear-gradient(
                    90deg,

                    rgba(0, 0, 0, 0.58) 0%,

                    rgba(0, 0, 0, 0.27) 28%,

                    rgba(0, 0, 0, 0.06) 58%,

                    rgba(0, 0, 0, 0.05) 100%
                ),

                linear-gradient(
                    0deg,

                    rgba(0, 0, 0, 0.92) 0%,

                    rgba(0, 0, 0, 0.58) 20%,

                    rgba(0, 0, 0, 0.10) 42%,

                    transparent 60%
                );
        }



        .capa-superior {

            position: absolute;

            inset: 0;

            z-index: 6;

            pointer-events: none;


            background:

                linear-gradient(
                    180deg,

                    rgba(0, 0, 0, 0.50) 0%,

                    transparent 27%
                );
        }



        /* =====================================================
           MARCA
        ===================================================== */

        .marca {

            position: absolute;

            top: 38px;
            left: 55px;

            z-index: 20;

            color: white;


            text-shadow:

                0 4px 16px
                rgba(0, 0, 0, 0.95);
        }



        .marca-superior {

            display: block;


            font-family:

                Georgia,

                "Times New Roman",

                serif;


            font-size: 21px;

            font-weight: bold;
        }



        .marca-principal {

            display: block;

            margin-top: -5px;


            font-family:

                Georgia,

                "Times New Roman",

                serif;


            font-size: 52px;

            font-style: italic;

            font-weight: bold;

            line-height: 1;
        }



        .marca-lugar {

            display: block;

            margin-top: 8px;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;
        }



        /* =====================================================
           TEXTO SUPERIOR DERECHO
        ===================================================== */

        .titulo-superior {

            position: absolute;

            top: 45px;
            right: 55px;

            z-index: 20;

            color: #efbd4d;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;


            text-shadow:

                0 3px 12px
                rgba(0, 0, 0, 0.95);
        }



        .titulo-superior::after {

            content: "";

            display: block;

            width: 100%;
            height: 2px;

            margin-top: 10px;


            background:

                linear-gradient(
                    90deg,

                    transparent,

                    #efbd4d,

                    transparent
                );
        }



        /* =====================================================
           INFORMACIÓN ABAJO A LA IZQUIERDA
        ===================================================== */

        .informacion {

            position: absolute;

            left: 58px;
            bottom: 50px;

            z-index: 30;

            width:
                min(
                    760px,
                    58vw
                );
        }



        .categoria {

            margin-bottom: 10px;

            color: #efbd4d;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 4px;

            text-transform: uppercase;


            text-shadow:

                0 3px 12px
                rgba(0, 0, 0, 1);
        }



        /* =====================================================
           NOMBRE DEL POSTRE
        ===================================================== */

        .nombre-postre {

            color: white;


            font-family:

                Georgia,

                "Times New Roman",

                serif;


            font-size:

                clamp(
                    48px,
                    5.4vw,
                    86px
                );


            font-weight: bold;

            line-height: 0.98;

            max-width: 760px;


            text-shadow:

                0 5px 24px
                rgba(0, 0, 0, 1),

                0 2px 8px
                rgba(0, 0, 0, 1);
        }



        /*
            SEGUNDO EFECTO:
            aparece el nombre después de la imagen
        */

        .nombre-postre.animando {

            animation:

                entradaTitulo

                0.85s

                ease

                1.05s

                both;
        }



        @keyframes entradaTitulo {

            from {

                opacity: 0;

                transform:
                    translateY(38px);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }



        /* =====================================================
           DESCRIPCIÓN
        ===================================================== */

        .descripcion-postre {

            max-width: 680px;

            margin-top: 18px;


            color:

                rgba(
                    255,
                    255,
                    255,
                    0.93
                );


            font-size:

                clamp(
                    19px,
                    1.7vw,
                    27px
                );


            font-weight: 400;

            line-height: 1.35;


            text-shadow:

                0 3px 12px
                rgba(0, 0, 0, 1),

                0 1px 5px
                rgba(0, 0, 0, 1);
        }



        /*
            TERCER EFECTO:
            aparece la descripción
        */

        .descripcion-postre.animando {

            animation:

                entradaDescripcion

                0.85s

                ease

                1.85s

                both;
        }



        @keyframes entradaDescripcion {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }



        /* =====================================================
           LÍNEA DORADA
        ===================================================== */

        .linea-dorada {

            width: 130px;

            height: 4px;

            margin-top: 19px;

            background: #efbd4d;


            box-shadow:

                0 0 12px

                rgba(
                    239,
                    189,
                    77,
                    0.40
                );


            transform-origin: left;
        }



        .linea-dorada.animando {

            animation:

                entradaLinea

                0.8s

                ease

                2.3s

                both;
        }



        @keyframes entradaLinea {

            from {

                opacity: 0;

                transform:
                    scaleX(0);
            }


            to {

                opacity: 1;

                transform:
                    scaleX(1);
            }
        }



        /* =====================================================
           BOTÓN PANTALLA COMPLETA
        ===================================================== */

        .boton-pantalla-completa {

            position: absolute;

            top: 105px;
            right: 55px;

            z-index: 100;


            display: flex;

            align-items: center;

            justify-content: center;


            min-width: 220px;

            min-height: 50px;


            padding:

                12px

                22px;


            border:

                2px solid

                #efbd4d;


            border-radius: 28px;


            color: #efbd4d;


            background:

                rgba(
                    0,
                    0,
                    0,
                    0.74
                );


            font-size: 14px;

            font-weight: bold;

            letter-spacing: 1px;


            cursor: pointer;


            backdrop-filter:
                blur(6px);


            -webkit-backdrop-filter:
                blur(6px);


            transition:

                background 0.25s ease,

                color 0.25s ease,

                transform 0.25s ease;
        }



        .boton-pantalla-completa:hover,
        .boton-pantalla-completa:focus {

            color: #17100b;

            background: #efbd4d;


            transform:
                scale(1.05);


            outline:

                4px solid white;


            outline-offset:
                3px;
        }



        .boton-pantalla-completa.oculto {

            display: none;
        }



        /* =====================================================
           PRESENTACIÓN INICIAL
        ===================================================== */

        .presentacion {

            position: absolute;

            inset: 0;

            z-index: 500;


            display: flex;

            align-items: center;

            justify-content: center;


            background:
                #080604;


            opacity: 1;

            visibility: visible;


            transition:

                opacity
                1s
                ease,

                visibility
                1s
                ease;
        }



        .presentacion.oculta {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }



        .presentacion-fondo {

            position: absolute;

            inset: 0;


            width: 100%;

            height: 100%;


            object-fit: cover;


            filter:

                blur(14px)

                brightness(0.30)

                saturate(1.20);


            transform:
                scale(1.12);
        }



        .presentacion-capa {

            position: absolute;

            inset: 0;


            background:

                radial-gradient(

                    circle at center,

                    rgba(
                        80,
                        35,
                        10,
                        0.30
                    ),

                    rgba(
                        0,
                        0,
                        0,
                        0.92
                    )
                );
        }



        .presentacion-contenido {

            position: relative;

            z-index: 5;


            width: 90%;


            color: white;


            text-align: center;
        }



        .presentacion-marca {

            margin-bottom: 27px;


            color: #efbd4d;


            font-size: 19px;


            font-weight: bold;


            letter-spacing: 6px;


            text-transform: uppercase;
        }



        .presentacion-titulo {

            font-family:

                Georgia,

                "Times New Roman",

                serif;


            font-size:

                clamp(
                    60px,
                    8vw,
                    125px
                );


            font-weight: bold;


            line-height: 1;


            text-shadow:

                0 8px 35px

                rgba(
                    0,
                    0,
                    0,
                    0.95
                );


            animation:

                aparecerPresentacion

                1.2s

                ease

                forwards;
        }



        .presentacion-linea {

            width: 180px;

            height: 5px;


            margin:

                32px

                auto

                25px;


            background: #efbd4d;


            animation:

                lineaPresentacion

                1.1s

                ease

                0.35s

                both;
        }



        .presentacion-subtitulo {

            color:

                rgba(
                    255,
                    255,
                    255,
                    0.86
                );


            font-size:

                clamp(
                    18px,
                    2vw,
                    28px
                );


            letter-spacing: 5px;


            text-transform: uppercase;


            animation:

                aparecerPresentacion

                1.1s

                ease

                0.55s

                both;
        }



        @keyframes aparecerPresentacion {

            from {

                opacity: 0;

                transform:
                    translateY(32px);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }



        @keyframes lineaPresentacion {

            from {

                opacity: 0;

                transform:
                    scaleX(0);
            }


            to {

                opacity: 1;

                transform:
                    scaleX(1);
            }
        }



        /* =====================================================
           MENSAJE PANTALLA COMPLETA
        ===================================================== */

        .mensaje-pantalla {

            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 9999;


            display: none;


            width:

                min(
                    520px,
                    85%
                );


            padding: 25px;


            border:

                2px solid

                #efbd4d;


            border-radius: 18px;


            color: white;


            background:

                rgba(
                    0,
                    0,
                    0,
                    0.95
                );


            text-align: center;


            font-size: 18px;


            line-height: 1.5;


            transform:

                translate(
                    -50%,
                    -50%
                );
        }



        .mensaje-pantalla.visible {

            display: block;
        }



        .cerrar-mensaje {

            margin-top: 18px;


            padding:

                10px

                25px;


            border: none;


            border-radius: 20px;


            color: #17100b;


            background: #efbd4d;


            font-size: 16px;


            font-weight: bold;


            cursor: pointer;
        }



        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1000px) {

            .nombre-postre {

                font-size:

                    clamp(
                        42px,
                        5vw,
                        65px
                    );
            }


            .descripcion-postre {

                max-width: 570px;
            }
        }



        @media (max-width: 700px) {

            .marca {

                top: 22px;

                left: 22px;
            }


            .marca-principal {

                font-size: 39px;
            }


            .titulo-superior {

                display: none;
            }


            .boton-pantalla-completa {

                top: 22px;

                right: 18px;


                min-width: auto;


                min-height: 43px;


                padding:

                    9px

                    14px;


                font-size: 11px;
            }


            .informacion {

                left: 20px;

                right: 20px;

                bottom: 24px;

                width: auto;
            }


            .nombre-postre {

                font-size: 40px;
            }


            .descripcion-postre {

                font-size: 17px;

                max-width: 95%;
            }


            .presentacion-titulo {

                font-size: 55px;
            }
        }

    </style>

</head>


<body>


    <main
        id="carrusel"
        class="carrusel"
    >


        <!-- IMAGEN PRINCIPAL -->

        <img
            id="imagenPrincipal"

            class="imagen-principal animando"

            src="{{ url_for('static', filename='carrusel_postres/pera_malbec.png') }}"

            alt="Pera al Malbec con helado de cayote"
        >



        <!-- SOMBRAS -->

        <div class="capa-oscura"></div>

        <div class="capa-superior"></div>



        <!-- MARCA -->

        <div class="marca">


            <span class="marca-superior">
                La Peña de
            </span>


            <span class="marca-principal">
                Marito
            </span>


            <span class="marca-lugar">
                PURMAMARCA
            </span>


        </div>



        <!-- TÍTULO SUPERIOR -->

        <div class="titulo-superior">
            Postres
        </div>



        <!-- PANTALLA COMPLETA -->

        <button
            id="botonPantallaCompleta"

            class="boton-pantalla-completa"

            type="button"
        >
            ⛶ PANTALLA COMPLETA
        </button>



        <!-- INFORMACIÓN -->

        <section class="informacion">


            <p class="categoria">
                Postre
            </p>


            <h1
                id="nombrePostre"

                class="nombre-postre animando"
            >
                Pera al Malbec con helado de cayote
            </h1>


            <p
                id="descripcionPostre"

                class="descripcion-postre animando"
            >
                Pera cocida al Malbec acompañada
                con helado de cayote.
            </p>


            <div
                id="lineaDorada"

                class="linea-dorada animando"
            ></div>


        </section>



        <!-- PRESENTACIÓN INICIAL -->

        <section
            id="presentacion"

            class="presentacion"
        >


            <img
                class="presentacion-fondo"

                src="{{ url_for('static', filename='carrusel_postres/pera_malbec.png') }}"

                alt=""
            >


            <div class="presentacion-capa"></div>


            <div class="presentacion-contenido">


                <p class="presentacion-marca">
                    La Peña de Marito · Purmamarca
                </p>


                <h1 class="presentacion-titulo">
                    Postres
                </h1>


                <div class="presentacion-linea"></div>


                <p class="presentacion-subtitulo">
                    Dulces sabores de nuestra tierra
                </p>


            </div>


        </section>


    </main>



    <!-- MENSAJE DE ERROR -->

    <div
        id="mensajePantalla"

        class="mensaje-pantalla"
    >


        <p>
            Este navegador no permitió activar
            la pantalla completa.
        </p>


        <button
            id="cerrarMensaje"

            class="cerrar-mensaje"

            type="button"
        >
            Cerrar
        </button>


    </div>



    <script>


        /* =====================================================
           POSTRES
        ===================================================== */


        const postres = [


            {
                nombre:
                    "Pera al Malbec con helado de cayote",

                descripcion:
                    "Pera cocida al Malbec acompañada con helado de cayote, una combinación suave y bien norteña.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/pera_malbec.png') }}"
            },


            {
                nombre:
                    "Quesillo con cayote y nueces",

                descripcion:
                    "Quesillo artesanal acompañado con dulce de cayote y nueces.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/quesillo_cayote.png') }}"
            },


            {
                nombre:
                    "Helado de cayote con nueces",

                descripcion:
                    "Helado cremoso de cayote acompañado con nueces y sabores de nuestra región.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/helado_cayote_nueces.png') }}"
            },


            {
                nombre:
                    "Flan de quinoa",

                descripcion:
                    "Flan casero elaborado con quinoa y acompañado con caramelo.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/flan_quinoa.png') }}"
            },


            {
                nombre:
                    "Helado de chocolate",

                descripcion:
                    "Helado cremoso de chocolate, intenso y suave, ideal para los amantes de los sabores clásicos.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/helado_chocolate.png') }}"
            },


            {
                nombre:
                    "Helado de cereza",

                descripcion:
                    "Helado de cereza fresco, cremoso y frutal, perfecto para terminar la comida.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/helado_cereza.png') }}"
            },


            {
                nombre:
                    "Helado de chocolate y cereza",

                descripcion:
                    "Chocolate y cereza en una combinación cremosa que mezcla intensidad y frescura.",

                imagen:
                    "{{ url_for('static', filename='carrusel_postres/helado_chocolate_cereza.png') }}"
            }

        ];



        /* =====================================================
           ELEMENTOS
        ===================================================== */


        const carrusel =
            document.getElementById(
                "carrusel"
            );


        const imagenPrincipal =
            document.getElementById(
                "imagenPrincipal"
            );


        const nombrePostre =
            document.getElementById(
                "nombrePostre"
            );


        const descripcionPostre =
            document.getElementById(
                "descripcionPostre"
            );


        const lineaDorada =
            document.getElementById(
                "lineaDorada"
            );


        const presentacion =
            document.getElementById(
                "presentacion"
            );


        const botonPantallaCompleta =
            document.getElementById(
                "botonPantallaCompleta"
            );


        const mensajePantalla =
            document.getElementById(
                "mensajePantalla"
            );


        const cerrarMensaje =
            document.getElementById(
                "cerrarMensaje"
            );



        /* =====================================================
           VARIABLES
        ===================================================== */


        let indiceActual = 0;


        let temporizadorPostre;


        let temporizadorPresentacion;



        const duracionPresentacion =
            3000;



        const duracionPostre =
            7000;



        /* =====================================================
           PRECARGAR IMÁGENES
        ===================================================== */


        postres.forEach(

            (postre) => {


                const imagen =
                    new Image();


                imagen.src =
                    postre.imagen;


            }

        );



        /* =====================================================
           REINICIAR ANIMACIONES
        ===================================================== */


        function reiniciarAnimaciones() {


            imagenPrincipal
                .classList
                .remove(
                    "animando"
                );


            nombrePostre
                .classList
                .remove(
                    "animando"
                );


            descripcionPostre
                .classList
                .remove(
                    "animando"
                );


            lineaDorada
                .classList
                .remove(
                    "animando"
                );


            void imagenPrincipal.offsetWidth;


            imagenPrincipal
                .classList
                .add(
                    "animando"
                );


            nombrePostre
                .classList
                .add(
                    "animando"
                );


            descripcionPostre
                .classList
                .add(
                    "animando"
                );


            lineaDorada
                .classList
                .add(
                    "animando"
                );

        }



        /* =====================================================
           MOSTRAR POSTRE
        ===================================================== */


        function mostrarPostre(
            nuevoIndice
        ) {


            indiceActual =

                (
                    nuevoIndice +
                    postres.length
                )

                %

                postres.length;



            imagenPrincipal
                .style
                .opacity =
                "0";



            setTimeout(
                () => {


                    const postre =
                        postres[
                            indiceActual
                        ];



                    imagenPrincipal.src =
                        postre.imagen;


                    imagenPrincipal.alt =
                        postre.nombre;



                    nombrePostre.textContent =
                        postre.nombre;



                    descripcionPostre.textContent =
                        postre.descripcion;



                    reiniciarAnimaciones();



                    imagenPrincipal
                        .style
                        .opacity =
                        "1";


                },
                450
            );

        }



        /* =====================================================
           SIGUIENTE POSTRE
        ===================================================== */


        function siguientePostreAutomatico() {


            /*
                Cuando llega al último,
                vuelve a aparecer
                la presentación POSTRES.
            */


            if (
                indiceActual ===
                postres.length - 1
            ) {


                mostrarPresentacion();


                return;
            }



            mostrarPostre(
                indiceActual + 1
            );

        }



        /* =====================================================
           TEMPORIZADOR
        ===================================================== */


        function iniciarTemporizadorPostre() {


            detenerTemporizadorPostre();


            temporizadorPostre =

                setInterval(

                    siguientePostreAutomatico,

                    duracionPostre

                );

        }



        function detenerTemporizadorPostre() {


            if (
                temporizadorPostre
            ) {


                clearInterval(
                    temporizadorPostre
                );


                temporizadorPostre =
                    null;

            }

        }



        function detenerTemporizadores() {


            detenerTemporizadorPostre();



            if (
                temporizadorPresentacion
            ) {


                clearTimeout(
                    temporizadorPresentacion
                );


                temporizadorPresentacion =
                    null;

            }

        }



        /* =====================================================
           PRESENTACIÓN
        ===================================================== */


        function mostrarPresentacion() {


            detenerTemporizadores();



            presentacion
                .classList
                .remove(
                    "oculta"
                );



            temporizadorPresentacion =

                setTimeout(
                    () => {


                        presentacion
                            .classList
                            .add(
                                "oculta"
                            );



                        indiceActual = 0;



                        mostrarPostre(
                            0
                        );



                        iniciarTemporizadorPostre();


                    },
                    duracionPresentacion
                );

        }



        /* =====================================================
           PANTALLA COMPLETA
        ===================================================== */


        function estaEnPantallaCompleta() {


            return Boolean(

                document.fullscreenElement ||

                document.webkitFullscreenElement ||

                document.msFullscreenElement

            );

        }



        async function activarPantallaCompleta() {


            try {


                if (
                    carrusel.requestFullscreen
                ) {


                    await carrusel
                        .requestFullscreen();


                } else if (
                    carrusel.webkitRequestFullscreen
                ) {


                    carrusel
                        .webkitRequestFullscreen();


                } else if (
                    carrusel.msRequestFullscreen
                ) {


                    carrusel
                        .msRequestFullscreen();


                } else {


                    mensajePantalla
                        .classList
                        .add(
                            "visible"
                        );

                }


            } catch (
                error
            ) {


                mensajePantalla
                    .classList
                    .add(
                        "visible"
                    );

            }

        }



        function actualizarBotonPantallaCompleta() {


            if (
                estaEnPantallaCompleta()
            ) {


                botonPantallaCompleta
                    .classList
                    .add(
                        "oculto"
                    );


            } else {


                botonPantallaCompleta
                    .classList
                    .remove(
                        "oculto"
                    );

            }

        }



        botonPantallaCompleta
            .addEventListener(
                "click",
                activarPantallaCompleta
            );



        document
            .addEventListener(
                "fullscreenchange",
                actualizarBotonPantallaCompleta
            );



        document
            .addEventListener(
                "webkitfullscreenchange",
                actualizarBotonPantallaCompleta
            );



        document
            .addEventListener(
                "MSFullscreenChange",
                actualizarBotonPantallaCompleta
            );



        cerrarMensaje
            .addEventListener(
                "click",
                () => {


                    mensajePantalla
                        .classList
                        .remove(
                            "visible"
                        );

                }
            );



        /* =====================================================
           INICIAR
        ===================================================== */


        mostrarPresentacion();


    </script>


</body>

</html>
