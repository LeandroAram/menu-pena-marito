<!-- =================================================
     CASITA Y EXPLICACIÓN DE LOS POSTRES
================================================== -->

<style>
    /* CASITA INFERIOR DERECHA */

    .boton-casita-postres {
        position: fixed;
        right: 22px;
        bottom: 20px;
        z-index: 3000;

        display: flex;
        align-items: center;
        justify-content: center;

        width: 54px;
        height: 54px;

        border: 2px solid #efbd4d;
        border-radius: 50%;

        color: #efbd4d;
        background: rgba(0, 0, 0, 0.72);

        cursor: pointer;

        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);

        box-shadow:
            0 7px 22px rgba(0, 0, 0, 0.55);

        transition:
            transform 0.25s ease,
            color 0.25s ease,
            background 0.25s ease;
    }

    .boton-casita-postres:hover,
    .boton-casita-postres:focus {
        color: #17100b;
        background: #efbd4d;

        transform: scale(1.08);

        outline: 4px solid white;
        outline-offset: 3px;
    }

    .boton-casita-postres svg {
        width: 27px;
        height: 27px;

        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* PANEL CON INFORMACIÓN */

    .panel-info-postre {
        position: fixed;
        inset: 0;
        z-index: 5000;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px;

        background: rgba(0, 0, 0, 0.74);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity 0.3s ease,
            visibility 0.3s ease;
    }

    .panel-info-postre.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .tarjeta-info-postre {
        position: relative;

        width: min(720px, 92vw);

        padding: 35px 38px 32px;

        border: 2px solid #efbd4d;
        border-radius: 24px;

        color: white;

        background:
            linear-gradient(
                145deg,
                rgba(18, 10, 6, 0.98),
                rgba(52, 27, 12, 0.97)
            );

        box-shadow:
            0 22px 65px rgba(0, 0, 0, 0.75);

        transform:
            translateY(20px)
            scale(0.97);

        transition: transform 0.3s ease;
    }

    .panel-info-postre.visible .tarjeta-info-postre {
        transform:
            translateY(0)
            scale(1);
    }

    .etiqueta-info-postre {
        margin-bottom: 11px;

        color: #efbd4d;

        font-size: 14px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .titulo-info-postre {
        margin-bottom: 18px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1.05;
    }

    .texto-info-postre {
        color: rgba(255, 255, 255, 0.91);

        font-size: clamp(18px, 2vw, 24px);
        line-height: 1.55;
    }

    .cerrar-info-postre {
        display: block;

        margin: 28px auto 0;
        padding: 12px 31px;

        border: none;
        border-radius: 25px;

        color: #17100b;
        background: #efbd4d;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    .cerrar-info-postre:focus {
        outline: 4px solid white;
        outline-offset: 3px;
    }

    .indicacion-info-postre {
        position: fixed;
        left: 50%;
        bottom: 17px;
        z-index: 2500;

        color: rgba(255, 255, 255, 0.66);

        font-size: 12px;
        letter-spacing: 1px;

        transform: translateX(-50%);

        text-shadow:
            0 2px 8px rgba(0, 0, 0, 0.95);

        pointer-events: none;
    }

    @media (max-width: 700px) {
        .boton-casita-postres {
            right: 17px;
            bottom: 16px;

            width: 50px;
            height: 50px;
        }

        .indicacion-info-postre {
            display: none;
        }

        .tarjeta-info-postre {
            padding: 28px 24px 26px;
        }
    }
</style>


<!-- CASITA -->

<button
    id="botonCasitaPostres"
    class="boton-casita-postres"
    type="button"
    aria-label="Salir de pantalla completa"
    title="Salir de pantalla completa"
>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5.5 10v10h13V10"></path>
        <path d="M9.5 20v-6h5v6"></path>
    </svg>
</button>


<p class="indicacion-info-postre">
    Tocá o mantené presionado para conocer el postre
</p>


<!-- EXPLICACIÓN DEL POSTRE -->

<section
    id="panelInfoPostre"
    class="panel-info-postre"
    aria-hidden="true"
>
    <article class="tarjeta-info-postre">

        <p class="etiqueta-info-postre">
            Conocé nuestro postre
        </p>

        <h2
            id="tituloInfoPostre"
            class="titulo-info-postre"
        ></h2>

        <p
            id="textoInfoPostre"
            class="texto-info-postre"
        ></p>

        <button
            id="cerrarInfoPostre"
            class="cerrar-info-postre"
            type="button"
        >
            Cerrar
        </button>

    </article>
</section>


<script>
    const descripcionesPostres = [
        {
            nombre: "Pera al Malbec con helado de cayote",

            descripcion:
                "Pera cocida lentamente al Malbec, acompañada con helado de cayote. Una combinación suave, frutal y con sabores de nuestra región."
        },

        {
            nombre: "Quesillo con cayote y nueces",

            descripcion:
                "Quesillo fresco acompañado con dulce de cayote y nueces. Un postre tradicional que combina suavidad, dulzor y textura."
        },

        {
            nombre: "Helado de cayote con nueces",

            descripcion:
                "Helado de cayote acompañado con nueces. Cremoso, delicado y con el sabor característico de nuestra tierra."
        },

        {
            nombre: "Flan de quinoa",

            descripcion:
                "Flan casero elaborado con quinoa y bañado en caramelo. Una versión regional de un clásico de siempre."
        },

        {
            nombre: "Helado de chocolate",

            descripcion:
                "Helado cremoso de chocolate, de sabor intenso y textura suave. Ideal para quienes disfrutan los postres clásicos."
        },

        {
            nombre: "Helado de cereza",

            descripcion:
                "Helado de cereza fresco, cremoso y frutal. Una opción suave para terminar la comida con algo dulce."
        },

        {
            nombre: "Helado de chocolate y cereza",

            descripcion:
                "Una combinación de helado de chocolate y cereza. El sabor intenso del chocolate se une con el toque frutal de la cereza."
        }
    ];


    const botonCasitaPostres =
        document.getElementById("botonCasitaPostres");

    const panelInfoPostre =
        document.getElementById("panelInfoPostre");

    const tituloInfoPostre =
        document.getElementById("tituloInfoPostre");

    const textoInfoPostre =
        document.getElementById("textoInfoPostre");

    const cerrarInfoPostre =
        document.getElementById("cerrarInfoPostre");

    const carruselPostresActual =
        document.getElementById("carrusel");

    const presentacionPostresActual =
        document.getElementById("presentacion");


    let temporizadorPulsacionPostre;
    let fuePulsacionLarga = false;

    const tiempoPulsacionLarga = 650;


    /* =========================================
       ABRIR EXPLICACIÓN
    ========================================= */

    function abrirInformacionPostre() {

        if (
            presentacionPostresActual &&
            !presentacionPostresActual.classList.contains("oculta")
        ) {
            return;
        }

        const postreActual =
            descripcionesPostres[indiceActual];

        if (!postreActual) {
            return;
        }

        if (
            typeof detenerTemporizadorPostre === "function"
        ) {
            detenerTemporizadorPostre();
        }

        tituloInfoPostre.textContent =
            postreActual.nombre;

        textoInfoPostre.textContent =
            postreActual.descripcion;

        panelInfoPostre.classList.add("visible");

        panelInfoPostre.setAttribute(
            "aria-hidden",
            "false"
        );

        setTimeout(() => {
            cerrarInfoPostre.focus();
        }, 100);
    }


    /* =========================================
       CERRAR EXPLICACIÓN
    ========================================= */

    function cerrarInformacionPostre() {

        panelInfoPostre.classList.remove("visible");

        panelInfoPostre.setAttribute(
            "aria-hidden",
            "true"
        );

        if (
            typeof iniciarTemporizadorPostre === "function"
        ) {
            iniciarTemporizadorPostre();
        }
    }


    cerrarInfoPostre.addEventListener(
        "click",
        cerrarInformacionPostre
    );


    panelInfoPostre.addEventListener(
        "click",
        (evento) => {

            if (evento.target === panelInfoPostre) {
                cerrarInformacionPostre();
            }
        }
    );


    /* =========================================
       TOCAR O MANTENER PRESIONADO
    ========================================= */

    carruselPostresActual.addEventListener(
        "contextmenu",
        (evento) => {
            evento.preventDefault();
        }
    );


    carruselPostresActual.addEventListener(
        "pointerdown",
        (evento) => {

            if (evento.target.closest("button")) {
                return;
            }

            fuePulsacionLarga = false;

            temporizadorPulsacionPostre =
                setTimeout(() => {

                    fuePulsacionLarga = true;

                    abrirInformacionPostre();

                }, tiempoPulsacionLarga);
        }
    );


    carruselPostresActual.addEventListener(
        "pointerup",
        (evento) => {

            clearTimeout(
                temporizadorPulsacionPostre
            );

            if (evento.target.closest("button")) {
                return;
            }

            if (!fuePulsacionLarga) {
                abrirInformacionPostre();
            }
        }
    );


    carruselPostresActual.addEventListener(
        "pointercancel",
        () => {

            clearTimeout(
                temporizadorPulsacionPostre
            );
        }
    );


    carruselPostresActual.addEventListener(
        "pointerleave",
        () => {

            clearTimeout(
                temporizadorPulsacionPostre
            );
        }
    );


    /* =========================================
       SALIR DE PANTALLA COMPLETA
    ========================================= */

    async function salirPantallaCompletaPostres() {

        try {

            if (
                document.fullscreenElement &&
                document.exitFullscreen
            ) {
                await document.exitFullscreen();

            } else if (
                document.webkitFullscreenElement &&
                document.webkitExitFullscreen
            ) {
                document.webkitExitFullscreen();

            } else if (
                document.msFullscreenElement &&
                document.msExitFullscreen
            ) {
                document.msExitFullscreen();
            }

        } catch (error) {

            console.error(
                "No se pudo salir de pantalla completa:",
                error
            );
        }
    }


    botonCasitaPostres.addEventListener(
        "click",
        salirPantallaCompletaPostres
    );


    /* =========================================
       CONTROL CON TECLADO O CONTROL REMOTO
    ========================================= */

    document.addEventListener(
        "keydown",
        (evento) => {

            if (
                evento.key === "Enter" &&
                !panelInfoPostre.classList.contains("visible")
            ) {
                abrirInformacionPostre();
            }

            if (
                evento.key === "Escape" &&
                panelInfoPostre.classList.contains("visible")
            ) {
                cerrarInformacionPostre();
            }
        }
    );
</script>
