<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrusel de Postres</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080605;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font-family: inherit;
        }

        .carrusel {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #080605;
        }

        /* =====================================
           IMAGEN PRINCIPAL
        ===================================== */

        .imagen-principal {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            opacity: 1;
            transform: scale(1);

            transition: opacity 0.7s ease;
        }

        .imagen-principal.animando {
            animation: acercamiento 5.5s linear forwards;
        }

        @keyframes acercamiento {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.07);
            }
        }

        /* =====================================
           CAPAS OSCURAS
        ===================================== */

        .capa-oscura {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.92) 0%,
                    rgba(0, 0, 0, 0.72) 25%,
                    rgba(0, 0, 0, 0.16) 58%,
                    rgba(0, 0, 0, 0.06) 100%
                ),
                linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.94) 0%,
                    transparent 43%
                );
        }

        .capa-superior {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.52) 0%,
                    transparent 30%
                );
        }

        /* =====================================
           MARCA
        ===================================== */

        .marca {
            position: absolute;
            top: 35px;
            left: 55px;
            z-index: 10;

            color: white;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.85);
        }

        .marca-superior {
            display: block;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 21px;
            font-weight: bold;
        }

        .marca-principal {
            display: block;

            margin-top: -4px;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 52px;
            font-style: italic;
            font-weight: bold;
            line-height: 1;
        }

        .marca-lugar {
            display: block;

            margin-top: 8px;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* =====================================
           TÍTULO SUPERIOR
        ===================================== */

        .titulo-superior {
            position: absolute;
            top: 46px;
            right: 55px;
            z-index: 10;

            color: #efbd4d;

            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.8);
        }

        .titulo-superior::after {
            content: "";

            display: block;

            width: 100%;
            height: 2px;

            margin-top: 11px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #efbd4d,
                    transparent
                );
        }

        /* =====================================
           BOTÓN PANTALLA COMPLETA
        ===================================== */

        .boton-pantalla-completa {
            position: absolute;
            top: 105px;
            right: 55px;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            min-width: 235px;
            min-height: 54px;

            padding: 13px 24px;

            border: 2px solid #efbd4d;
            border-radius: 30px;

            color: #efbd4d;
            background: rgba(0, 0, 0, 0.82);

            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;

            cursor: pointer;

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.55);

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .boton-pantalla-completa:hover,
        .boton-pantalla-completa:focus {
            color: #17100b;
            background: #efbd4d;
            transform: scale(1.05);
            outline: 4px solid white;
            outline-offset: 3px;
        }

        .boton-pantalla-completa.oculto {
            display: none;
        }

        /* =====================================
           INFORMACIÓN DEL POSTRE
        ===================================== */

        .informacion {
            position: absolute;
            top: 48%;
            left: 8%;
            z-index: 10;

            width: min(570px, 42vw);

            transform: translateY(-50%);
        }

        .categoria {
            margin-bottom: 15px;

            color: #efbd4d;

            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nombre-postre {
            color: white;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(43px, 5vw, 76px);
            font-weight: bold;
            line-height: 1.05;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.85);
        }

        .nombre-postre.animando {
            animation: aparecerNombre 0.9s ease forwards;
        }

        @keyframes aparecerNombre {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .linea-dorada {
            width: 130px;
            height: 4px;

            margin-top: 28px;

            background: #efbd4d;

            transform-origin: left;
        }

        .linea-dorada.animando {
            animation: aparecerLinea 0.9s ease 0.25s both;
        }

        @keyframes aparecerLinea {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* =====================================
           FLECHAS
        ===================================== */

        .flecha {
            position: absolute;
            top: 47%;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 70px;
            height: 70px;

            border: 2px solid #efbd4d;
            border-radius: 50%;

            color: #efbd4d;
            background: rgba(0, 0, 0, 0.28);

            font-size: 43px;
            line-height: 1;

            cursor: pointer;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transition:
                transform 0.25s ease,
                color 0.25s ease,
                background 0.25s ease;
        }

        .flecha:hover,
        .flecha:focus {
            color: #17100b;
            background: #efbd4d;
            transform: scale(1.08);
            outline: 4px solid white;
            outline-offset: 3px;
        }

        .flecha-anterior {
            left: 28px;
        }

        .flecha-siguiente {
            right: 28px;
        }

        /* =====================================
           MINIATURAS
        ===================================== */

        .miniaturas {
            position: absolute;
            left: 50%;
            bottom: 48px;
            z-index: 20;

            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;

            width: calc(100% - 170px);

            transform: translateX(-50%);
        }

        .miniatura {
            width: 130px;

            color: white;
            text-align: center;

            opacity: 0.68;
            cursor: pointer;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .miniatura:hover,
        .miniatura:focus {
            opacity: 1;
            transform: translateY(-7px);
            outline: none;
        }

        .miniatura-imagen {
            display: block;

            width: 94px;
            height: 94px;

            margin: auto;

            object-fit: cover;

            border: 2px solid rgba(239, 189, 77, 0.55);
            border-radius: 50%;

            transition:
                border 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .miniatura.activa {
            opacity: 1;
        }

        .miniatura.activa .miniatura-imagen {
            border: 4px solid #efbd4d;

            transform: scale(1.08);

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.85);
        }

        .miniatura-nombre {
            display: block;

            margin-top: 11px;

            font-size: 13px;
            font-weight: bold;
            line-height: 1.2;

            text-shadow:
                0 2px 8px black;
        }

        .miniatura.activa .miniatura-nombre {
            color: #f8d681;
        }

        /* =====================================
           INDICADORES
        ===================================== */

        .indicadores {
            position: absolute;
            left: 50%;
            bottom: 17px;
            z-index: 20;

            display: flex;
            gap: 9px;

            transform: translateX(-50%);
        }

        .punto {
            width: 10px;
            height: 10px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.42);

            cursor: pointer;

            transition:
                width 0.3s ease,
                background 0.3s ease,
                border-radius 0.3s ease;
        }

        .punto.activo {
            width: 28px;

            border-radius: 8px;

            background: #efbd4d;
        }

        /* =====================================
           MENSAJE DE ERROR DE PANTALLA COMPLETA
        ===================================== */

        .mensaje-pantalla {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 9999;

            display: none;

            width: min(520px, 85%);

            padding: 25px;

            border: 2px solid #efbd4d;
            border-radius: 18px;

            color: white;
            background: rgba(0, 0, 0, 0.94);

            text-align: center;
            font-size: 18px;
            line-height: 1.5;

            transform: translate(-50%, -50%);

            box-shadow:
                0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .mensaje-pantalla.visible {
            display: block;
        }

        .cerrar-mensaje {
            margin-top: 18px;
            padding: 10px 25px;

            border: none;
            border-radius: 20px;

            color: #17100b;
            background: #efbd4d;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        /* =====================================
           PANTALLAS MEDIANAS
        ===================================== */

        @media (max-width: 1050px) {
            .miniaturas {
                gap: 10px;
                width: calc(100% - 80px);
            }

            .miniatura {
                width: 92px;
            }

            .miniatura-imagen {
                width: 72px;
                height: 72px;
            }

            .miniatura-nombre {
                display: none;
            }

            .boton-pantalla-completa {
                right: 25px;
                min-width: 205px;
                font-size: 13px;
            }
        }

        /* =====================================
           CELULARES
        ===================================== */

        @media (max-width: 700px) {
            .marca {
                top: 25px;
                left: 24px;
            }

            .marca-principal {
                font-size: 40px;
            }

            .titulo-superior {
                display: none;
            }

            .boton-pantalla-completa {
                top: 25px;
                right: 20px;

                min-width: auto;
                min-height: 45px;

                padding: 10px 16px;

                font-size: 12px;
            }

            .informacion {
                top: 56%;
                left: 12%;

                width: 75%;
            }

            .nombre-postre {
                font-size: 42px;
            }

            .flecha {
                width: 50px;
                height: 50px;

                font-size: 30px;
            }

            .flecha-anterior {
                left: 12px;
            }

            .flecha-siguiente {
                right: 12px;
            }

            .miniaturas {
                bottom: 30px;

                justify-content: flex-start;

                overflow-x: auto;
            }

            .miniatura {
                flex: 0 0 70px;
            }

            .miniatura-imagen {
                width: 60px;
                height: 60px;
            }

            .indicadores {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main
        id="carrusel"
        class="carrusel"
    >

        <!-- IMAGEN PRINCIPAL -->

        <img
            id="imagenPrincipal"
            class="imagen-principal animando"
            src="{{ url_for('static', filename='carrusel_postres/pera_malbec.png') }}"
            alt="Pera al Malbec con helado de cayote"
        >

        <div class="capa-oscura"></div>
        <div class="capa-superior"></div>

        <!-- MARCA -->

        <div class="marca">

            <span class="marca-superior">
                La Peña de
            </span>

            <span class="marca-principal">
                Marito
            </span>

            <span class="marca-lugar">
                PURMAMARCA
            </span>

        </div>

        <!-- TÍTULO -->

        <div class="titulo-superior">
            Carrusel de postres
        </div>

        <!-- BOTÓN PANTALLA COMPLETA -->

        <button
            id="botonPantallaCompleta"
            class="boton-pantalla-completa"
            type="button"
        >
            ⛶ PANTALLA COMPLETA
        </button>

        <!-- INFORMACIÓN -->

        <section class="informacion">

            <p class="categoria">
                Postres
            </p>

            <h1
                id="nombrePostre"
                class="nombre-postre animando"
            >
                Pera al Malbec con helado de cayote
            </h1>

            <div
                id="lineaDorada"
                class="linea-dorada animando"
            ></div>

        </section>

        <!-- FLECHAS -->

        <button
            id="anterior"
            class="flecha flecha-anterior"
            type="button"
            aria-label="Postre anterior"
        >
            ‹
        </button>

        <button
            id="siguiente"
            class="flecha flecha-siguiente"
            type="button"
            aria-label="Siguiente postre"
        >
            ›
        </button>

        <!-- MINIATURAS -->

        <div
            id="miniaturas"
            class="miniaturas"
        ></div>

        <!-- PUNTOS -->

        <div
            id="indicadores"
            class="indicadores"
        ></div>

    </main>

    <!-- MENSAJE SI EL NAVEGADOR NO PERMITE PANTALLA COMPLETA -->

    <div
        id="mensajePantalla"
        class="mensaje-pantalla"
    >
        <p>
            Este navegador de la televisión no permitió activar
            la pantalla completa.
        </p>

        <button
            id="cerrarMensaje"
            class="cerrar-mensaje"
            type="button"
        >
            Cerrar
        </button>
    </div>

    <script>
        const postres = [
            {
                nombre: "Pera al Malbec con helado de cayote",
                nombreCorto: "Pera al Malbec",
                imagen: "{{ url_for('static', filename='carrusel_postres/pera_malbec.png') }}"
            },
            {
                nombre: "Quesillo con cayote y nueces",
                nombreCorto: "Quesillo con cayote",
                imagen: "{{ url_for('static', filename='carrusel_postres/quesillo_cayote.png') }}"
            },
            {
                nombre: "Helado de cayote con nueces",
                nombreCorto: "Helado de cayote",
                imagen: "{{ url_for('static', filename='carrusel_postres/helado_cayote_nueces.png') }}"
            },
            {
                nombre: "Flan de quinoa",
                nombreCorto: "Flan de quinoa",
                imagen: "{{ url_for('static', filename='carrusel_postres/flan_quinoa.png') }}"
            },
            {
                nombre: "Helado de chocolate",
                nombreCorto: "Helado de chocolate",
                imagen: "{{ url_for('static', filename='carrusel_postres/helado_chocolate.png') }}"
            },
            {
                nombre: "Helado de cereza",
                nombreCorto: "Helado de cereza",
                imagen: "{{ url_for('static', filename='carrusel_postres/helado_cereza.png') }}"
            },
            {
                nombre: "Helado de chocolate y cereza",
                nombreCorto: "Chocolate y cereza",
                imagen: "{{ url_for('static', filename='carrusel_postres/helado_chocolate_cereza.png') }}"
            }
        ];

        const carrusel =
            document.getElementById("carrusel");

        const imagenPrincipal =
            document.getElementById("imagenPrincipal");

        const nombrePostre =
            document.getElementById("nombrePostre");

        const lineaDorada =
            document.getElementById("lineaDorada");

        const contenedorMiniaturas =
            document.getElementById("miniaturas");

        const contenedorIndicadores =
            document.getElementById("indicadores");

        const botonAnterior =
            document.getElementById("anterior");

        const botonSiguiente =
            document.getElementById("siguiente");

        const botonPantallaCompleta =
            document.getElementById("botonPantallaCompleta");

        const mensajePantalla =
            document.getElementById("mensajePantalla");

        const cerrarMensaje =
            document.getElementById("cerrarMensaje");

        let indiceActual = 0;
        let temporizador;

        const duracion = 5500;


        /* =====================================
           CREAR MINIATURAS Y PUNTOS
        ===================================== */

        function crearControles() {
            postres.forEach((postre, indice) => {

                const miniatura =
                    document.createElement("div");

                miniatura.className = "miniatura";
                miniatura.tabIndex = 0;

                if (indice === 0) {
                    miniatura.classList.add("activa");
                }

                miniatura.innerHTML = `
                    <img
                        class="miniatura-imagen"
                        src="${postre.imagen}"
                        alt="${postre.nombre}"
                    >

                    <span class="miniatura-nombre">
                        ${postre.nombreCorto}
                    </span>
                `;

                miniatura.addEventListener("click", () => {
                    mostrarPostre(indice);
                    reiniciarTemporizador();
                });

                miniatura.addEventListener("keydown", (evento) => {
                    if (
                        evento.key === "Enter" ||
                        evento.key === " "
                    ) {
                        mostrarPostre(indice);
                        reiniciarTemporizador();
                    }
                });

                contenedorMiniaturas.appendChild(miniatura);


                const punto =
                    document.createElement("button");

                punto.className = "punto";
                punto.type = "button";

                if (indice === 0) {
                    punto.classList.add("activo");
                }

                punto.setAttribute(
                    "aria-label",
                    `Mostrar ${postre.nombre}`
                );

                punto.addEventListener("click", () => {
                    mostrarPostre(indice);
                    reiniciarTemporizador();
                });

                contenedorIndicadores.appendChild(punto);
            });
        }


        /* =====================================
           REINICIAR ANIMACIONES
        ===================================== */

        function reiniciarAnimaciones() {
            imagenPrincipal.classList.remove("animando");
            nombrePostre.classList.remove("animando");
            lineaDorada.classList.remove("animando");

            void imagenPrincipal.offsetWidth;

            imagenPrincipal.classList.add("animando");
            nombrePostre.classList.add("animando");
            lineaDorada.classList.add("animando");
        }


        /* =====================================
           MOSTRAR POSTRE
        ===================================== */

        function mostrarPostre(nuevoIndice) {
            const miniaturas =
                document.querySelectorAll(".miniatura");

            const puntos =
                document.querySelectorAll(".punto");

            indiceActual =
                (nuevoIndice + postres.length) %
                postres.length;

            imagenPrincipal.style.opacity = "0";

            setTimeout(() => {
                imagenPrincipal.src =
                    postres[indiceActual].imagen;

                imagenPrincipal.alt =
                    postres[indiceActual].nombre;

                nombrePostre.textContent =
                    postres[indiceActual].nombre;

                miniaturas.forEach((miniatura) => {
                    miniatura.classList.remove("activa");
                });

                puntos.forEach((punto) => {
                    punto.classList.remove("activo");
                });

                miniaturas[indiceActual]
                    .classList.add("activa");

                puntos[indiceActual]
                    .classList.add("activo");

                reiniciarAnimaciones();

                imagenPrincipal.style.opacity = "1";

            }, 350);
        }


        function siguientePostre() {
            mostrarPostre(indiceActual + 1);
        }


        function anteriorPostre() {
            mostrarPostre(indiceActual - 1);
        }


        /* =====================================
           TEMPORIZADOR AUTOMÁTICO
        ===================================== */

        function iniciarTemporizador() {
            detenerTemporizador();

            temporizador = setInterval(
                siguientePostre,
                duracion
            );
        }


        function detenerTemporizador() {
            if (temporizador) {
                clearInterval(temporizador);
            }
        }


        function reiniciarTemporizador() {
            iniciarTemporizador();
        }


        botonSiguiente.addEventListener("click", () => {
            siguientePostre();
            reiniciarTemporizador();
        });


        botonAnterior.addEventListener("click", () => {
            anteriorPostre();
            reiniciarTemporizador();
        });


        document.addEventListener("keydown", (evento) => {

            if (evento.key === "ArrowRight") {
                siguientePostre();
                reiniciarTemporizador();
            }

            if (evento.key === "ArrowLeft") {
                anteriorPostre();
                reiniciarTemporizador();
            }

            if (
                evento.key === "f" ||
                evento.key === "F"
            ) {
                activarPantallaCompleta();
            }
        });


        /* =====================================
           PANTALLA COMPLETA
        ===================================== */

        function estaEnPantallaCompleta() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement
            );
        }


        async function activarPantallaCompleta() {
            try {
                if (carrusel.requestFullscreen) {
                    await carrusel.requestFullscreen();

                } else if (carrusel.webkitRequestFullscreen) {
                    carrusel.webkitRequestFullscreen();

                } else if (carrusel.msRequestFullscreen) {
                    carrusel.msRequestFullscreen();

                } else {
                    mensajePantalla.classList.add("visible");
                    return;
                }

            } catch (error) {
                mensajePantalla.classList.add("visible");
            }
        }


        function actualizarBotonPantallaCompleta() {
            if (estaEnPantallaCompleta()) {
                botonPantallaCompleta.classList.add("oculto");
            } else {
                botonPantallaCompleta.classList.remove("oculto");
            }
        }


        botonPantallaCompleta.addEventListener(
            "click",
            activarPantallaCompleta
        );


        document.addEventListener(
            "fullscreenchange",
            actualizarBotonPantallaCompleta
        );


        document.addEventListener(
            "webkitfullscreenchange",
            actualizarBotonPantallaCompleta
        );


        document.addEventListener(
            "MSFullscreenChange",
            actualizarBotonPantallaCompleta
        );


        cerrarMensaje.addEventListener("click", () => {
            mensajePantalla.classList.remove("visible");
        });


        /* =====================================
           INICIAR
        ===================================== */

        crearControles();
        iniciarTemporizador();
    </script>

</body>

</html>
