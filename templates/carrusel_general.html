<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        La Peña de Marito - Carrusel
    </title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #080604;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        button {
            font-family: inherit;
        }


        .carrusel {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #080604;
        }



        /* =====================================================
           IMAGEN PRINCIPAL
        ===================================================== */

        .imagen-principal {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            opacity: 1;

            transform: scale(1);

            transition:
                opacity 0.8s ease;
        }


        .imagen-principal.animando {
            animation:
                entradaProducto
                var(--duracion-imagen, 7s)
                ease-out
                forwards;
        }


        @keyframes entradaProducto {

            0% {
                opacity: 0;

                transform:
                    scale(1.07);
            }


            12% {
                opacity: 1;
            }


            100% {
                opacity: 1;

                transform:
                    scale(1.015);
            }

        }



        /* =====================================================
           SOMBRAS
        ===================================================== */

        .capa-oscura {
            position: absolute;

            inset: 0;

            z-index: 5;

            pointer-events: none;

            background:

                linear-gradient(
                    90deg,

                    rgba(0, 0, 0, 0.58) 0%,

                    rgba(0, 0, 0, 0.27) 28%,

                    rgba(0, 0, 0, 0.06) 58%,

                    rgba(0, 0, 0, 0.05) 100%
                ),

                linear-gradient(
                    0deg,

                    rgba(0, 0, 0, 0.92) 0%,

                    rgba(0, 0, 0, 0.58) 20%,

                    rgba(0, 0, 0, 0.10) 42%,

                    transparent 60%
                );
        }


        .capa-superior {
            position: absolute;

            inset: 0;

            z-index: 6;

            pointer-events: none;

            background:

                linear-gradient(
                    180deg,

                    rgba(0, 0, 0, 0.50) 0%,

                    transparent 27%
                );
        }



        /* =====================================================
           MARCA
        ===================================================== */

        .marca {
            position: absolute;

            top: 38px;
            left: 55px;

            z-index: 20;

            color: white;

            text-shadow:
                0 4px 16px
                rgba(0, 0, 0, 0.95);
        }


        .marca-superior {
            display: block;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 21px;

            font-weight: bold;
        }


        .marca-principal {
            display: block;

            margin-top: -5px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 52px;

            font-style: italic;

            font-weight: bold;

            line-height: 1;
        }


        .marca-lugar {
            display: block;

            margin-top: 8px;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;
        }



        /* =====================================================
           TÍTULO SUPERIOR DERECHO
        ===================================================== */

        .titulo-superior {
            position: absolute;

            top: 45px;
            right: 55px;

            z-index: 20;

            color: #efbd4d;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.95);
        }


        .titulo-superior::after {
            content: "";

            display: block;

            width: 100%;
            height: 2px;

            margin-top: 10px;

            background:

                linear-gradient(
                    90deg,

                    transparent,

                    #efbd4d,

                    transparent
                );
        }



        /* =====================================================
           INFORMACIÓN
        ===================================================== */

        .informacion {
            position: absolute;

            left: 58px;
            bottom: 50px;

            z-index: 30;

            width:
                min(
                    800px,
                    61vw
                );

            --descripcion-delay: 1.85s;
            --linea-delay: 2.30s;
        }


        .categoria {
            margin-bottom: 10px;

            color: #efbd4d;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 1);
        }



        /* =====================================================
           NOMBRE DEL PRODUCTO
        ===================================================== */

        .nombre-producto {
            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:

                clamp(
                    48px,
                    5.4vw,
                    86px
                );

            font-weight: bold;

            line-height: 0.98;

            max-width: 800px;

            text-shadow:

                0 5px 24px
                rgba(0, 0, 0, 1),

                0 2px 8px
                rgba(0, 0, 0, 1);
        }


        .nombre-producto.animando {
            animation:

                entradaTitulo

                0.85s

                ease

                1.05s

                both;
        }


        @keyframes entradaTitulo {

            from {
                opacity: 0;

                transform:
                    translateY(38px);
            }


            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }



        /* =====================================================
           DETALLE / VARIEDAD DEL VINO
        ===================================================== */

        .detalle-producto {
            margin-top: 14px;

            color: #efbd4d;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:

                clamp(
                    19px,
                    1.8vw,
                    28px
                );

            font-weight: bold;

            line-height: 1.25;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 1);
        }


        .detalle-producto.oculto {
            display: none;
        }


        .detalle-producto.animando {
            animation:

                entradaDetalle

                0.8s

                ease

                1.55s

                both;
        }


        @keyframes entradaDetalle {

            from {
                opacity: 0;

                transform:
                    translateY(18px);
            }


            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }



        /* =====================================================
           DESCRIPCIÓN
        ===================================================== */

        .descripcion-producto {
            max-width: 700px;

            margin-top: 17px;

            color:

                rgba(
                    255,
                    255,
                    255,
                    0.94
                );

            font-size:

                clamp(
                    19px,
                    1.7vw,
                    27px
                );

            font-weight: 400;

            line-height: 1.35;

            text-shadow:

                0 3px 12px
                rgba(0, 0, 0, 1),

                0 1px 5px
                rgba(0, 0, 0, 1);
        }


        .descripcion-producto.animando {
            animation:

                entradaDescripcion

                0.85s

                ease

                var(--descripcion-delay)

                both;
        }


        @keyframes entradaDescripcion {

            from {
                opacity: 0;

                transform:
                    translateY(20px);
            }


            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }



        /* =====================================================
           LÍNEA DORADA
        ===================================================== */

        .linea-dorada {
            width: 130px;
            height: 4px;

            margin-top: 19px;

            background: #efbd4d;

            box-shadow:

                0 0 12px

                rgba(
                    239,
                    189,
                    77,
                    0.40
                );

            transform-origin: left;
        }


        .linea-dorada.animando {
            animation:

                entradaLinea

                0.8s

                ease

                var(--linea-delay)

                both;
        }


        @keyframes entradaLinea {

            from {
                opacity: 0;

                transform:
                    scaleX(0);
            }


            to {
                opacity: 1;

                transform:
                    scaleX(1);
            }

        }



        /* =====================================================
           BOTÓN PANTALLA COMPLETA
        ===================================================== */

        .boton-pantalla-completa {
            position: absolute;

            top: 105px;
            right: 55px;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;

            min-width: 220px;
            min-height: 50px;

            padding:
                12px
                22px;

            border:
                2px solid
                #efbd4d;

            border-radius: 28px;

            color: #efbd4d;

            background:

                rgba(
                    0,
                    0,
                    0,
                    0.74
                );

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            backdrop-filter:
                blur(6px);

            -webkit-backdrop-filter:
                blur(6px);

            transition:

                background 0.25s ease,

                color 0.25s ease,

                transform 0.25s ease;
        }


        .boton-pantalla-completa:hover,
        .boton-pantalla-completa:focus {

            color: #17100b;

            background: #efbd4d;

            transform:
                scale(1.05);

            outline:
                4px solid white;

            outline-offset:
                3px;
        }


        .boton-pantalla-completa.oculto {
            display: none;
        }



        /* =====================================================
           CASITA PARA SALIR DE PANTALLA COMPLETA
        ===================================================== */

        .boton-casita {
            position: absolute;

            right: 22px;
            bottom: 20px;

            z-index: 150;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 52px;
            height: 52px;

            border:
                2px solid
                #efbd4d;

            border-radius: 50%;

            color: #efbd4d;

            background:

                rgba(
                    0,
                    0,
                    0,
                    0.64
                );

            cursor: pointer;

            backdrop-filter:
                blur(6px);

            -webkit-backdrop-filter:
                blur(6px);
        }


        .boton-casita svg {
            width: 26px;
            height: 26px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2.2;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .boton-casita:hover,
        .boton-casita:focus {

            background: #efbd4d;

            color: #17100b;

            outline:
                4px solid white;

            outline-offset:
                3px;
        }



        /* =====================================================
           PRESENTACIÓN DE CADA SECCIÓN
        ===================================================== */

        .presentacion {
            position: absolute;

            inset: 0;

            z-index: 500;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                #080604;

            opacity: 1;

            visibility: visible;

            transition:

                opacity
                1s
                ease,

                visibility
                1s
                ease;
        }


        .presentacion.oculta {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .presentacion-fondo {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            filter:

                blur(14px)

                brightness(0.30)

                saturate(1.20);

            transform:
                scale(1.12);

            transition:
                opacity 0.5s ease;
        }


        .presentacion-capa {
            position: absolute;

            inset: 0;

            background:

                radial-gradient(

                    circle at center,

                    rgba(
                        80,
                        35,
                        10,
                        0.30
                    ),

                    rgba(
                        0,
                        0,
                        0,
                        0.92
                    )
                );
        }


        .presentacion-contenido {
            position: relative;

            z-index: 5;

            width: 90%;

            color: white;

            text-align: center;
        }


        .presentacion-marca {
            margin-bottom: 27px;

            color: #efbd4d;

            font-size: 19px;

            font-weight: bold;

            letter-spacing: 6px;

            text-transform: uppercase;
        }


        .presentacion-titulo {
            font-family:

                Georgia,

                "Times New Roman",

                serif;

            font-size:

                clamp(
                    60px,
                    8vw,
                    125px
                );

            font-weight: bold;

            line-height: 1;

            text-shadow:

                0 8px 35px

                rgba(
                    0,
                    0,
                    0,
                    0.95
                );
        }


        .presentacion-titulo.animando {
            animation:

                aparecerPresentacion

                1.2s

                ease

                forwards;
        }


        .presentacion-linea {
            width: 180px;
            height: 5px;

            margin:

                32px

                auto

                25px;

            background: #efbd4d;
        }


        .presentacion-linea.animando {
            animation:

                lineaPresentacion

                1.1s

                ease

                0.35s

                both;
        }


        .presentacion-subtitulo {
            color:

                rgba(
                    255,
                    255,
                    255,
                    0.86
                );

            font-size:

                clamp(
                    18px,
                    2vw,
                    28px
                );

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        .presentacion-subtitulo.animando {
            animation:

                aparecerPresentacion

                1.1s

                ease

                0.55s

                both;
        }


        @keyframes aparecerPresentacion {

            from {
                opacity: 0;

                transform:
                    translateY(32px);
            }


            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        @keyframes lineaPresentacion {

            from {
                opacity: 0;

                transform:
                    scaleX(0);
            }


            to {
                opacity: 1;

                transform:
                    scaleX(1);
            }

        }



        /* =====================================================
           MENSAJE DE ERROR
        ===================================================== */

        .mensaje-pantalla {
            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 9999;

            display: none;

            width:
                min(
                    520px,
                    85%
                );

            padding: 25px;

            border:
                2px solid
                #efbd4d;

            border-radius: 18px;

            color: white;

            background:

                rgba(
                    0,
                    0,
                    0,
                    0.95
                );

            text-align: center;

            font-size: 18px;

            line-height: 1.5;

            transform:
                translate(
                    -50%,
                    -50%
                );
        }


        .mensaje-pantalla.visible {
            display: block;
        }


        .cerrar-mensaje {
            margin-top: 18px;

            padding:
                10px
                25px;

            border: none;

            border-radius: 20px;

            color: #17100b;

            background: #efbd4d;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }



        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1000px) {

            .nombre-producto {

                font-size:

                    clamp(
                        42px,
                        5vw,
                        65px
                    );
            }


            .descripcion-producto {
                max-width: 570px;
            }

        }


        @media (max-width: 700px) {

            .marca {
                top: 22px;
                left: 22px;
            }


            .marca-principal {
                font-size: 39px;
            }


            .titulo-superior {
                display: none;
            }


            .boton-pantalla-completa {
                top: 22px;
                right: 18px;

                min-width: auto;

                min-height: 43px;

                padding:
                    9px
                    14px;

                font-size: 11px;
            }


            .informacion {
                left: 20px;
                right: 20px;

                bottom: 24px;

                width: auto;
            }


            .nombre-producto {
                font-size: 40px;
            }


            .detalle-producto {
                font-size: 19px;
            }


            .descripcion-producto {
                font-size: 17px;

                max-width: 95%;
            }


            .presentacion-titulo {
                font-size: 55px;
            }

        }

    </style>

</head>


<body>

    >

        </button>



        <!-- =================================================

        <section

                    Platos Regionales

                </h1>



                <div
                    id="presentacionLinea"

                    class="presentacion-linea animando"
                ></div>



                <p
                    id="presentacionSubtitulo"

                    class="presentacion-subtitulo animando"
                >

                    Sabores auténticos de nuestra tierra

                </p>


            </div>


        </section>


    </main>



    <!-- =====================================================
         MENSAJE DE ERROR
    ====================================================== -->

    <div
        id="mensajePantalla"

        class="mensaje-pantalla"
    >


        <p>

            Este navegador no permitió cambiar
            el modo de pantalla completa.

        </p>


        <button
            id="cerrarMensaje"

            class="cerrar-mensaje"

            type="button"
        >

            Cerrar

        </button>


    </div>

        ];



        /* =====================================================
           ELEMENTOS DE LA PÁGINA
        ===================================================== */


        const carrusel =
            document.getElementById(
                "carrusel"
            );


        const imagenPrincipal =
            document.getElementById(
                "imagenPrincipal"
            );


        const informacion =
            document.getElementById(
                "informacion"
            );


        const nombreProducto =
            document.getElementById(
                "nombreProducto"
            );


        const detalleProducto =
            document.getElementById(
                "detalleProducto"
            );


        const descripcionProducto =
            document.getElementById(
                "descripcionProducto"
            );


        const categoriaProducto =
            document.getElementById(
                "categoriaProducto"
            );


        const tituloSuperior =
            document.getElementById(
                "tituloSuperior"
            );


        const lineaDorada =
            document.getElementById(
                "lineaDorada"
            );


        const presentacion =
            document.getElementById(
                "presentacion"
            );


        const presentacionFondo =
            document.getElementById(
                "presentacionFondo"
            );


        const presentacionTitulo =
            document.getElementById(
                "presentacionTitulo"
            );


        const presentacionSubtitulo =
            document.getElementById(
                "presentacionSubtitulo"
            );


        const presentacionLinea =
            document.getElementById(
                "presentacionLinea"
            );


        const botonPantallaCompleta =
            document.getElementById(
                "botonPantallaCompleta"
            );


        const botonCasita =
            document.getElementById(
                "botonCasita"
            );


        const mensajePantalla =
            document.getElementById(
                "mensajePantalla"
            );


        const cerrarMensaje =
            document.getElementById(
                "cerrarMensaje"
            );



        /* =====================================================
           VARIABLES
        ===================================================== */


        let indiceSeccion =
            0;


        let indiceProducto =
            0;


        let temporizadorProducto;


        let temporizadorPresentacion;



        /*
            La pantalla de presentación de
            REGIONALES / POSTRES / VINOS
            dura 3 segundos.
        */

        const duracionPresentacion =
            3000;



        /* =====================================================
           PRECARGAR TODAS LAS IMÁGENES
        ===================================================== */


        secciones.forEach(

            (seccion) => {


                seccion.productos.forEach(

                    (producto) => {


                        const imagen =
                            new Image();


                        imagen.src =
                            producto.imagen;


                    }

                );


            }

        );



        /* =====================================================
           REINICIAR ANIMACIONES DEL PRODUCTO
        ===================================================== */


        function reiniciarAnimacionesProducto(
            tieneDetalle,
            duracion
        ) {


            imagenPrincipal
                .classList
                .remove(
                    "animando"
                );


            nombreProducto
                .classList
                .remove(
                    "animando"
                );


            detalleProducto
                .classList
                .remove(
                    "animando"
                );


            descripcionProducto
                .classList
                .remove(
                    "animando"
                );


            lineaDorada
                .classList
                .remove(
                    "animando"
                );



            /*
                Ajustamos el zoom según
                cuánto dura el producto.
            */

            imagenPrincipal
                .style
                .setProperty(
                    "--duracion-imagen",
                    duracion + "ms"
                );



            /*
                EN VINOS:
                imagen
                nombre
                variedad
                descripción
                línea

                EN COMIDAS/POSTRES:
                imagen
                nombre
                descripción
                línea
            */


            if (
                tieneDetalle
            ) {


                informacion
                    .style
                    .setProperty(
                        "--descripcion-delay",
                        "2.05s"
                    );


                informacion
                    .style
                    .setProperty(
                        "--linea-delay",
                        "2.55s"
                    );


            } else {


                informacion
                    .style
                    .setProperty(
                        "--descripcion-delay",
                        "1.85s"
                    );


                informacion
                    .style
                    .setProperty(
                        "--linea-delay",
                        "2.30s"
                    );

            }



            /*
                Obliga al navegador
                a reiniciar los efectos.
            */

            void imagenPrincipal.offsetWidth;



            imagenPrincipal
                .classList
                .add(
                    "animando"
                );


            nombreProducto
                .classList
                .add(
                    "animando"
                );



            if (
                tieneDetalle
            ) {


                detalleProducto
                    .classList
                    .add(
                        "animando"
                    );

            }



            descripcionProducto
                .classList
                .add(
                    "animando"
                );


            lineaDorada
                .classList
                .add(
                    "animando"
                );

        }



        /* =====================================================
           REINICIAR ANIMACIÓN DE PRESENTACIÓN
        ===================================================== */


        function reiniciarAnimacionesPresentacion() {


            presentacionTitulo
                .classList
                .remove(
                    "animando"
                );


            presentacionSubtitulo
                .classList
                .remove(
                    "animando"
                );


            presentacionLinea
                .classList
                .remove(
                    "animando"
                );


            void presentacionTitulo.offsetWidth;


            presentacionTitulo
                .classList
                .add(
                    "animando"
                );


            presentacionSubtitulo
                .classList
                .add(
                    "animando"
                );


            presentacionLinea
                .classList
                .add(
                    "animando"
                );

        }



        /* =====================================================
           MOSTRAR PRODUCTO
        ===================================================== */


        function mostrarProducto() {


            limpiarTemporizadorProducto();



            const seccion =
                secciones[
                    indiceSeccion
                ];


            const producto =
                seccion.productos[
                    indiceProducto
                ];



            /*
                Desaparece suavemente
                el producto anterior.
            */

            imagenPrincipal
                .style
                .opacity =
                "0";



            setTimeout(

                () => {


                    /*
                        Cambiamos la imagen.
                    */

                    imagenPrincipal.src =
                        producto.imagen;


                    imagenPrincipal.alt =
                        producto.nombre;



                    /*
                        Nombre.
                    */

                    nombreProducto.textContent =
                        producto.nombre;



                    /*
                        Descripción.
                    */

                    descripcionProducto.textContent =
                        producto.descripcion;



                    /*
                        Categoría.
                    */

                    categoriaProducto.textContent =
                        seccion.categoria;



                    /*
                        Título arriba a la derecha.
                    */

                    tituloSuperior.textContent =
                        seccion.tituloCorto;



                    /*
                        Detectar si este producto
                        tiene detalle/variedad.
                    */

                    const tieneDetalle =
                        Boolean(
                            producto.detalle
                        );



                    /*
                        Si estamos en vinos,
                        mostramos la variedad.
                    */

                    if (
                        tieneDetalle
                    ) {


                        detalleProducto.textContent =
                            producto.detalle;


                        detalleProducto
                            .classList
                            .remove(
                                "oculto"
                            );


                    } else {


                        /*
                            Regionales y Postres:
                            ocultamos esta línea.
                        */

                        detalleProducto.textContent =
                            "";


                        detalleProducto
                            .classList
                            .add(
                                "oculto"
                            );

                    }



                    /*
                        Reiniciar efectos.
                    */

                    reiniciarAnimacionesProducto(
                        tieneDetalle,
                        seccion.duracion
                    );



                    /*
                        Mostrar nueva imagen.
                    */

                    imagenPrincipal
                        .style
                        .opacity =
                        "1";



                    /*
                        AHORA empieza a contar
                        el tiempo del producto.

                        Esto permite que los 7 u 8 segundos
                        se vean completos.
                    */

                    temporizadorProducto =

                        setTimeout(

                            avanzar,

                            seccion.duracion

                        );


                },

                450

            );

        }



        /* =====================================================
           AVANZAR
        ===================================================== */


        function avanzar() {


            limpiarTemporizadorProducto();



            const seccion =
                secciones[
                    indiceSeccion
                ];



            /*
                Si todavía quedan productos
                dentro de la misma sección.
            */

            if (

                indiceProducto <

                seccion.productos.length - 1

            ) {


                indiceProducto++;


                mostrarProducto();


                return;

            }



            /*
                TERMINÓ LA SECCIÓN.

                Cambiamos:

                Regionales
                    ↓
                Postres
                    ↓
                Vinos
                    ↓
                Regionales
            */


            indiceSeccion =

                (
                    indiceSeccion + 1
                )

                %

                secciones.length;



            indiceProducto =
                0;



            mostrarPresentacionSeccion();

        }



        /* =====================================================
           PRESENTACIÓN DE CADA SECCIÓN
        ===================================================== */


        function mostrarPresentacionSeccion() {


            limpiarTemporizadores();



            const seccion =
                secciones[
                    indiceSeccion
                ];



            /*
                Nombre grande de la sección.
            */

            presentacionTitulo.textContent =
                seccion.titulo;



            /*
                Frase inferior.
            */

            presentacionSubtitulo.textContent =
                seccion.subtitulo;



            /*
                Fondo usando el primer producto
                de la sección.
            */

            presentacionFondo.src =
                seccion
                    .productos[0]
                    .imagen;



            /*
                Mostrar presentación.
            */

            presentacion
                .classList
                .remove(
                    "oculta"
                );



            reiniciarAnimacionesPresentacion();



            /*
                Luego de 3 segundos,
                empieza el primer producto.
            */

            temporizadorPresentacion =

                setTimeout(

                    () => {


                        presentacion
                            .classList
                            .add(
                                "oculta"
                            );



                        mostrarProducto();


                    },

                    duracionPresentacion

                );

        }



        /* =====================================================
           LIMPIAR TEMPORIZADORES
        ===================================================== */


        function limpiarTemporizadorProducto() {


            if (
                temporizadorProducto
            ) {


                clearTimeout(
                    temporizadorProducto
                );


                temporizadorProducto =
                    null;

            }

        }



        function limpiarTemporizadores() {


            limpiarTemporizadorProducto();



            if (
                temporizadorPresentacion
            ) {


                clearTimeout(
                    temporizadorPresentacion
                );


                temporizadorPresentacion =
                    null;

            }

        }



        /* =====================================================
           PANTALLA COMPLETA
        ===================================================== */


        function estaEnPantallaCompleta() {


            return Boolean(

                document.fullscreenElement ||

                document.webkitFullscreenElement ||

                document.msFullscreenElement

            );

        }



        async function activarPantallaCompleta() {


            try {


                if (
                    carrusel.requestFullscreen
                ) {


                    await carrusel
                        .requestFullscreen();


                } else if (
                    carrusel.webkitRequestFullscreen
                ) {


                    carrusel
                        .webkitRequestFullscreen();


                } else if (
                    carrusel.msRequestFullscreen
                ) {


                    carrusel
                        .msRequestFullscreen();


                } else {


                    mensajePantalla
                        .classList
                        .add(
                            "visible"
                        );

                }


            } catch (
                error
            ) {


                mensajePantalla
                    .classList
                    .add(
                        "visible"
                    );

            }

        }



        /* =====================================================
           SALIR DE PANTALLA COMPLETA
        ===================================================== */


        async function salirPantallaCompleta() {


            try {


                if (
                    document.fullscreenElement &&
                    document.exitFullscreen
                ) {


                    await document
                        .exitFullscreen();


                } else if (
                    document.webkitFullscreenElement &&
                    document.webkitExitFullscreen
                ) {


                    document
                        .webkitExitFullscreen();


                } else if (
                    document.msFullscreenElement &&
                    document.msExitFullscreen
                ) {


                    document
                        .msExitFullscreen();

                }


            } catch (
                error
            ) {


                mensajePantalla
                    .classList
                    .add(
                        "visible"
                    );

            }

        }



        /* =====================================================
           ACTUALIZAR BOTÓN DE PANTALLA COMPLETA
        ===================================================== */


        function actualizarBotonPantallaCompleta() {


            if (
                estaEnPantallaCompleta()
            ) {


                botonPantallaCompleta
                    .classList
                    .add(
                        "oculto"
                    );


            } else {


                botonPantallaCompleta
                    .classList
                    .remove(
                        "oculto"
                    );

            }

        }



        botonPantallaCompleta
            .addEventListener(

                "click",

                activarPantallaCompleta

            );



        botonCasita
            .addEventListener(

                "click",

                salirPantallaCompleta

            );



        document
            .addEventListener(

                "fullscreenchange",

                actualizarBotonPantallaCompleta

            );



        document
            .addEventListener(

                "webkitfullscreenchange",

                actualizarBotonPantallaCompleta

            );



        document
            .addEventListener(

                "MSFullscreenChange",

                actualizarBotonPantallaCompleta

            );



        cerrarMensaje
            .addEventListener(

                "click",

                () => {


                    mensajePantalla
                        .classList
                        .remove(
                            "visible"
                        );


                }

            );



        /* =====================================================
           INICIAR CARRUSEL
        ===================================================== */


        mostrarPresentacionSeccion();


    </script>
