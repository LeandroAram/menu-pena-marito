<head>

    <title>La Peña de Marito</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070707;
        }


        a {
            text-decoration: none;
        }


        button {
            font-family: inherit;
        }


        /* =========================================
           PORTADA
        ========================================= */

        .fondo {

            position: relative;

            width: 100%;

            min-height: 100vh;
            min-height: 100svh;

            overflow: hidden;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(1, 5, 13, 0.14) 0%,
                    rgba(0, 0, 0, 0.02) 42%,
                    rgba(0, 0, 0, 0.22) 63%,
                    rgba(0, 0, 0, 0.82) 100%
                ),
                url('/static/pena3.jpg');

            background-size: cover;

            background-position: center;

            display: flex;

            flex-direction: column;

            padding:
                calc(30px + env(safe-area-inset-top))
                6%
                calc(24px + env(safe-area-inset-bottom));
        }


        /*
        Oscurecimiento muy suave solamente arriba.
        Ayuda a que el título se lea sin tapar la foto.
        */

        .fondo::before {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    circle at 30% 10%,
                    rgba(0, 0, 0, 0.05),
                    transparent 45%
                );

            z-index: 0;
        }


        /* =========================================
           CONTENIDO
        ========================================= */

        .contenido {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1150px;

            margin: 0 auto;

            min-height:
                calc(
                    100vh
                    - 54px
                    - env(safe-area-inset-top)
                    - env(safe-area-inset-bottom)
                );

            display: flex;

            flex-direction: column;
        }


        /* =========================================
           CABECERA
        ========================================= */

        .cabecera {

            width: 100%;

            margin-top: 65px;
        }


        .titulo {

            max-width: 760px;
        }


        .titulo h1 {

            margin: 0;

            color: #e7b861;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(58px, 8vw, 102px);

            font-weight: 500;

            line-height: 0.94;

            letter-spacing: -2px;

            text-shadow:
                0 4px 18px rgba(0, 0, 0, 0.60);
        }


        .linea-titulo {

            width: 120px;

            height: 2px;

            margin-top: 24px;

            background:
                linear-gradient(
                    90deg,
                    #e4af54,
                    rgba(228, 175, 84, 0.05)
                );
        }


        .subtitulo {

            margin-top: 20px;

            color: rgba(255, 255, 255, 0.94);

            font-size: clamp(15px, 2.2vw, 21px);

            font-weight: 400;

            letter-spacing: 0.4px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.90);
        }


        /* =========================================
           ZONA INFERIOR
        ========================================= */

        .zona-menu {

            margin-top: auto;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding-top: 60px;
        }


        .menu-etiqueta {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 14px;

            margin-bottom: 13px;

            color: #e5b65d;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.9);
        }


        .menu-etiqueta::before,
        .menu-etiqueta::after {

            content: "";

            width: 55px;

            height: 1px;

            background:
                rgba(231, 184, 97, 0.65);
        }


        /* =========================================
           BOTÓN PRINCIPAL VER MENÚ
        ========================================= */

        .btn-menu-principal {

            width: min(660px, 92%);

            min-height: 104px;

            border: 1.5px solid #f0c873;

            border-radius: 38px;

            background:
                linear-gradient(
                    135deg,
                    #f0c66e 0%,
                    #d99d3c 100%
                );

            color: #21170b;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px 34px;

            box-shadow:
                0 0 0 4px rgba(232, 180, 86, 0.12),
                0 10px 36px rgba(0, 0, 0, 0.36);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            -webkit-tap-highlight-color: transparent;
        }


        .btn-menu-principal:hover {

            transform: translateY(-3px);

            box-shadow:
                0 0 0 5px rgba(232, 180, 86, 0.16),
                0 14px 40px rgba(0, 0, 0, 0.42);
        }


        .btn-menu-principal:active {

            transform: scale(0.98);
        }


        .menu-icono {

            width: 55px;

            height: 55px;

            flex-shrink: 0;

            border: 1.5px solid rgba(43, 28, 8, 0.55);

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            background:
                rgba(65, 43, 11, 0.10);
        }


        .menu-texto {

            flex: 1;

            text-align: center;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(32px, 4.5vw, 48px);

            font-weight: 500;
        }


        .menu-flecha {

            font-size: 48px;

            font-family: Georgia, serif;

            font-weight: 300;

            line-height: 1;
        }


        .ayuda-menu {

            margin-top: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            color: rgba(255, 255, 255, 0.90);

            font-size: 14px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.90);
        }


        .ayuda-menu .globo {

            color: #e7b861;

            font-size: 18px;
        }


        /* =========================================
           ACCIONES SECUNDARIAS
        ========================================= */

        .acciones {

            width: min(720px, 92%);

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 22px;
        }


        .accion-btn {

            width: 100%;

            min-height: 64px;

            border-radius: 24px;

            border:
                1px solid rgba(231, 184, 97, 0.92);

            background:
                rgba(8, 8, 8, 0.62);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            color: #f1c979;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;

            padding: 12px 16px;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.28);

            transition:
                background 0.25s ease,
                transform 0.25s ease,
                border-color 0.25s ease;

            -webkit-tap-highlight-color: transparent;
        }


        .accion-btn:hover {

            transform: translateY(-2px);

            background:
                rgba(40, 28, 13, 0.82);

            border-color:
                #efc56b;
        }


        .accion-btn:active {

            transform: scale(0.98);
        }


        .accion-icono {

            font-size: 22px;

            line-height: 1;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: 24px;

            padding-bottom: 2px;

            text-align: center;

            color:
                rgba(239, 194, 107, 0.85);

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: lowercase;

            text-shadow:
                0 2px 7px rgba(0, 0, 0, 0.9);
        }


        /* =========================================
           MODAL IDIOMAS
        ========================================= */

        .modal-idiomas {

            position: fixed;

            inset: 0;

            z-index: 20000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(0, 0, 0, 0.76);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);
        }


        .modal-idiomas.activo {

            display: flex;

            animation:
                aparecerModal 0.22s ease;
        }


        @keyframes aparecerModal {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        .idiomas-contenido {

            position: relative;

            width: min(430px, 100%);

            padding: 30px 22px 24px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31, 24, 15, 0.98),
                    rgba(10, 10, 10, 0.98)
                );

            border:
                1px solid rgba(233, 187, 101, 0.55);

            box-shadow:
                0 22px 60px rgba(0, 0, 0, 0.58);
        }


        .cerrar-idiomas {

            position: absolute;

            top: 12px;

            right: 12px;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            border: 1px solid
                rgba(255, 255, 255, 0.12);

            color: white;

            background:
                rgba(255, 255, 255, 0.06);

            font-size: 19px;

            cursor: pointer;
        }


        .idiomas-titulo {

            margin: 0;

            color: #efc46f;

            text-align: center;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 30px;

            font-weight: 500;
        }


        .idiomas-subtitulo {

            margin:
                8px 20px 22px;

            color:
                rgba(255, 255, 255, 0.73);

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }


        .lista-idiomas {

            display: grid;

            gap: 10px;
        }


        .idioma-opcion {

            width: 100%;

            min-height: 58px;

            padding: 13px 18px;

            border-radius: 17px;

            border:
                1px solid rgba(233, 187, 101, 0.30);

            background:
                rgba(255, 255, 255, 0.055);

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            transition:
                background 0.22s ease,
                border-color 0.22s ease,
                transform 0.22s ease;
        }


        .idioma-opcion:hover {

            background:
                rgba(233, 187, 101, 0.13);

            border-color:
                rgba(233, 187, 101, 0.82);

            transform:
                translateX(3px);
        }


        .idioma-izquierda {

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 17px;
        }


        .bandera {

            font-size: 24px;
        }


        .flecha-idioma {

            color: #e8b960;

            font-size: 24px;
        }


        /* =========================================
           MODAL VIDEO
        ========================================= */

        .modal-video {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 30000;

            justify-content: center;

            align-items: center;

            padding: 25px;

            background:
                rgba(0, 0, 0, 0.93);
        }


        .modal-contenido {

            width: min(430px, 100%);

            position: relative;
        }


        .modal-contenido video {

            display: block;

            width: 100%;

            max-height: 82vh;

            border-radius: 22px;

            background: black;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6);
        }


        .cerrar-video {

            position: absolute;

            top: -15px;

            right: -10px;

            z-index: 2;

            width: 43px;

            height: 43px;

            border: 1px solid
                rgba(255, 255, 255, 0.20);

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.86);

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        /* =========================================
           TABLETS / PANTALLAS GRANDES
        ========================================= */

        @media (min-width: 800px) {

            .fondo {

                padding-left: 8%;
                padding-right: 8%;
            }


            .cabecera {

                margin-top: 50px;
            }


            .zona-menu {

                padding-bottom: 10px;
            }
        }


        /* =========================================
           CELULARES
        ========================================= */

        @media (max-width: 700px) {

            .fondo {

                padding:

                    calc(22px + env(safe-area-inset-top))

                    5%

                    calc(16px + env(safe-area-inset-bottom));

                background-position:
                    center center;
            }


            .contenido {

                min-height:
                    calc(
                        100svh
                        - 38px
                        - env(safe-area-inset-top)
                        - env(safe-area-inset-bottom)
                    );
            }


            .cabecera {

                margin-top: 38px;
            }


            .titulo h1 {

                font-size:
                    clamp(47px, 13vw, 66px);

                max-width: 350px;

                letter-spacing: -1.5px;
            }


            .linea-titulo {

                width: 72px;

                margin-top: 16px;
            }


            .subtitulo {

                margin-top: 13px;

                font-size: 14px;

                line-height: 1.5;

                max-width: 340px;
            }


            .zona-menu {

                padding-top: 40px;
            }


            .menu-etiqueta {

                font-size: 11px;

                letter-spacing: 3px;

                margin-bottom: 9px;
            }


            .menu-etiqueta::before,
            .menu-etiqueta::after {

                width: 32px;
            }


            .btn-menu-principal {

                width: 100%;

                min-height: 82px;

                border-radius: 29px;

                padding: 10px 20px;
            }


            .menu-icono {

                width: 45px;

                height: 45px;

                font-size: 22px;

                border-radius: 10px;
            }


            .menu-texto {

                font-size: 30px;
            }


            .menu-flecha {

                font-size: 38px;
            }


            .ayuda-menu {

                margin-top: 11px;

                font-size: 12px;
            }


            .acciones {

                width: 100%;

                gap: 9px;

                margin-top: 17px;
            }


            .accion-btn {

                min-height: 55px;

                border-radius: 20px;

                font-size: 14px;

                padding: 9px 8px;

                gap: 7px;
            }


            .accion-icono {

                font-size: 18px;
            }


            .footer {

                margin-top: 15px;

                font-size: 9px;

                letter-spacing: 3px;
            }
        }


        /* =========================================
           CELULARES BAJITOS
        ========================================= */

        @media (max-height: 720px) and (max-width: 700px) {

            .cabecera {

                margin-top: 12px;
            }


            .titulo h1 {

                font-size: 44px;
            }


            .linea-titulo {

                margin-top: 10px;
            }


            .subtitulo {

                margin-top: 9px;

                font-size: 12px;
            }


            .zona-menu {

                padding-top: 22px;
            }


            .btn-menu-principal {

                min-height: 69px;

                border-radius: 24px;
            }


            .menu-icono {

                width: 40px;

                height: 40px;

                font-size: 19px;
            }


            .menu-texto {

                font-size: 26px;
            }


            .acciones {

                margin-top: 13px;
            }


            .accion-btn {

                min-height: 48px;

                font-size: 13px;
            }


            .footer {

                display: none;
            }
        }


    </style>

</head>


<body>


    <main class="fondo">

        <div class="contenido">


            <!-- CABECERA -->

            <section class="cabecera">

                <div class="titulo">

                    <h1>

                        de Marito
                    </h1>

                    <div class="linea-titulo"></div>

                    >

                    <button

    <!-- =========================================

                        </span>

                        </span>

                    </span>

    <!-- =========================================
         MODAL VIDEO
    ========================================== -->

    <div
        class="modal-video"
        id="modalVideo"
    >

        <div class="modal-contenido">


            <button
                class="cerrar-video"
                onclick="cerrarVideo()"
            >
                ×
            </button>


            <video
                id="videoMarito"
                controls
                playsinline
                webkit-playsinline
                preload="metadata"

                    type="video/mp4"
                >

    <script>


        /* =========================================
           IDIOMAS
        ========================================== */

        function abrirIdiomas() {

            document
                .getElementById("modalIdiomas")
                .classList
                .add("activo");

            document.body.style.overflow = "hidden";
        }



        function cerrarIdiomas() {

            document
                .getElementById("modalIdiomas")
                .classList
                .remove("activo");

            document.body.style.overflow = "";
        }



        document
            .getElementById("modalIdiomas")
            .addEventListener(
                "click",
                function(event) {

                    if (event.target === this) {

                        cerrarIdiomas();

                    }

                }
            );



        /* =========================================
           VIDEO
        ========================================== */

        function abrirVideo() {

            const modal =
                document.getElementById("modalVideo");

            const video =
                document.getElementById("videoMarito");

            modal.style.display = "flex";

            document.body.style.overflow = "hidden";

            video.currentTime = 0;

            video.play().catch(() => {});

        }



        function cerrarVideo() {

            const modal =
                document.getElementById("modalVideo");

            const video =
                document.getElementById("videoMarito");

            video.pause();

            video.currentTime = 0;

            modal.style.display = "none";

            document.body.style.overflow = "";

        }



        document
            .getElementById("modalVideo")
            .addEventListener(
                "click",
                function(event) {

                    if (event.target === this) {

                        cerrarVideo();

                    }

                }
            );



        /* =========================================
           ESC PARA CERRAR MODALES
        ========================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    cerrarIdiomas();

                    if (
                        document
                            .getElementById("modalVideo")
                            .style
                            .display === "flex"
                    ) {

                        cerrarVideo();

                    }

                }

            }
        );


    </script>
