<!DOCTYPE html>
<html>

<head>

    <title>La Peña de Marito</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            overflow:hidden;
        }

        .fondo{
            background-image:url('/static/pena3.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .fondo::before{
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.35);
            backdrop-filter:blur(2px);
        }

        .contenido{
            position:relative;
            z-index:2;
            text-align:center;
            width:90%;
            max-width:420px;
            padding:30px;
            border-radius:28px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);

            border:1px solid rgba(255,255,255,0.15);
        }

        h1{
            margin:0;
            color:white;
            font-size:52px;
            font-weight:700;
            letter-spacing:1px;
            line-height:1.1;
        }

        .subtitulo{
            color:#f3d7a5;
            font-size:18px;
            margin-top:12px;
            margin-bottom:35px;
            letter-spacing:2px;
        }

        .idiomas{
            display:flex;
            flex-direction:column;
            gap:14px;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{
            width:100%;
            padding:16px;
            border-radius:16px;

            border:1px solid rgba(255,255,255,0.25);

            background:rgba(255,255,255,0.10);

            color:white;

            font-size:20px;

            cursor:pointer;

            transition:0.3s;

            backdrop-filter:blur(5px);
        }

        .idioma-btn:hover{
            background:rgba(255,255,255,0.20);
            transform:scale(1.03);
        }

        @media(max-width:700px){

            h1{
                font-size:42px;
            }

            .subtitulo{
                font-size:15px;
            }

            .idioma-btn{
                font-size:18px;
                padding:14px;
            }

        }

    </style>

</head>

<body>

    <div class="fondo">

        <div class="contenido">

            <h1>La Peña<br>de Marito</h1>

            <div class="subtitulo">
                SABORES REGIONALES
            </div>

            <div class="idiomas">

                <a href="/menu_es">
                    <button class="idioma-btn">
                        🇦🇷 Español
                    </button>
                </a>

                <a href="/menu_en">
                    <button class="idioma-btn">
                        🇺🇸 English
                    </button>
                </a>

                <a href="/menu_fr">
                    <button class="idioma-btn">
                        🇫🇷 Français
                    </button>
                </a>

                <a href="/menu_pt">
                    <button class="idioma-btn">
                        🇧🇷 Português
                    </button>
                </a>

            </div>

        </div>

    </div>

</body>

</html>
