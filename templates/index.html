<!DOCTYPE html>
<html>

<head>

    <title>La Peña de Marito</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            overflow:hidden;
        }

        .fondo{
            background-image:url('/static/pena3.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            position:relative;
        }

        .overlay{

            width:100%;
            height:100%;

            display:flex;
            flex-direction:column;
            justify-content:flex-start;

            align-items:center;

            padding-top:50px;

            box-sizing:border-box;
        }

        .titulo{

            text-align:center;

            margin-top:20px;
        }

        h1{
            margin:0;

            font-size:62px;

            color:#f7d28b;

            letter-spacing:1px;

            text-shadow:0px 4px 10px rgba(0,0,0,0.55);
        }

        .subtitulo{

            margin-top:10px;

            color:white;

            font-size:20px;

            letter-spacing:2px;

            text-shadow:0px 2px 8px rgba(0,0,0,0.5);
        }

        .idiomas{

            display:flex;

            gap:12px;

            margin-top:25px;

            flex-wrap:wrap;

            justify-content:center;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{

            border:none;

            padding:12px 18px;

            border-radius:14px;

            font-size:17px;

            cursor:pointer;

            color:white;

            background:rgba(0,0,0,0.28);

            backdrop-filter:blur(4px);

            border:1px solid rgba(255,255,255,0.18);

            transition:0.3s;

            text-shadow:0px 2px 5px rgba(0,0,0,0.5);
        }

        .idioma-btn:hover{

            transform:translateY(-3px);

            background:rgba(0,0,0,0.42);
        }

        .acciones{

            position:absolute;

            left:50%;

            transform:translateX(-50%);

            bottom:calc(90px + env(safe-area-inset-bottom));

            display:flex;

            gap:15px;

            align-items:center;

            z-index:9999;
        }

        .whatsapp-btn{

            display:inline-block;

            background:#043D37;

            color:white;

            padding:14px 24px;

            border-radius:16px;

            font-size:18px;

            font-weight:bold;

            box-shadow:0px 0px 18px rgba(4,61,55,0.5);

            transition:0.3s;

            animation:brillo 2s infinite;
        }

        .whatsapp-btn:hover{

            transform:scale(1.05);

            background:#032E29;
        }

        .video-btn{

            border:none;

            background:rgba(0,0,0,0.55);

            color:white;

            padding:14px 24px;

            border-radius:16px;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            backdrop-filter:blur(6px);

            border:1px solid rgba(255,255,255,0.2);

            transition:0.3s;
        }

        .video-btn:hover{

            transform:scale(1.05);

            background:rgba(0,0,0,0.75);
        }

        @keyframes brillo{

            0%{
                box-shadow:0px 0px 6px rgba(4,61,55,0.3);
            }

            50%{
                box-shadow:0px 0px 14px rgba(4,61,55,0.7);
            }

            100%{
                box-shadow:0px 0px 6px rgba(4,61,55,0.3);
            }
        }

        .modal-video{

            display:none;

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.92);

            z-index:10000;

            justify-content:center;

            align-items:center;
        }

        .modal-contenido{

            width:90%;

            max-width:420px;

            position:relative;
        }

        .modal-contenido video{

            width:100%;

            border-radius:20px;
        }

        .cerrar-video{

            position:absolute;

            top:15px;

            right:15px;

            background:rgba(0,0,0,0.7);

            color:white;

            border:none;

            width:45px;

            height:45px;

            border-radius:50%;

            font-size:24px;

            cursor:pointer;

            z-index:10001;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        @media(max-width:700px){

            h1{
                font-size:42px;
            }

            .subtitulo{
                font-size:16px;
            }

            .idiomas{
                gap:10px;
            }

            .idioma-btn{
                font-size:15px;
                padding:10px 14px;
            }

            .acciones{

                flex-direction:column;

                width:90%;

                bottom:calc(120px + env(safe-area-inset-bottom));
            }

            .whatsapp-btn,
            .video-btn{

                width:100%;

                box-sizing:border-box;

                text-align:center;

                font-size:16px;

                padding:12px 18px;
            }
        }

    </style>

</head>

<body>

    <div class="fondo">

        <div class="overlay">

            <div class="titulo">

                <h1>La Peña de Marito</h1>

                <div class="subtitulo">
                    Seleccione su idioma
                </div>

                <div class="idiomas">

                    <a href="/menu_es">
                        <button class="idioma-btn">
                            🇦🇷 Español
                        </button>
                    </a>

                    <a href="/menu_en">
                        <button class="idioma-btn">
                            🇺🇸 English
                        </button>
                    </a>

                    <a href="/menu_fr">
                        <button class="idioma-btn">
                            🇫🇷 Français
                        </button>
                    </a>

                    <a href="/menu_pt">
                        <button class="idioma-btn">
                            🇧🇷 Português
                        </button>
                    </a>

                </div>

            </div>

        </div>

        <div class="acciones">

            <a href="https://wa.me/5493886827704?text=Hola%20La%20Peña%20de%20Marito,%20quiero%20realizar%20una%20reserva."
               target="_blank">

                <div class="whatsapp-btn">
                    📲 Reservar
                </div>

            </a>

            <button class="video-btn" onclick="abrirVideo()">
                🎥 Experiencia Marito
            </button>

        </div>

    </div>

    <div class="modal-video" id="modalVideo">

        <div class="modal-contenido">

            <button class="cerrar-video" onclick="cerrarVideo()">
                ✕
            </button>

            <video
                id="videoMarito"
                controls
                playsinline
                webkit-playsinline
                preload="metadata">

                <source src="/static/videos/experiencia-marito.mp4" type="video/mp4">

            </video>

        </div>

    </div>

    <script>

        function abrirVideo(){

            const modal = document.getElementById("modalVideo");
            const video = document.getElementById("videoMarito");

            modal.style.display = "flex";

            video.currentTime = 0;

            video.play().catch(() => {});
        }

        function cerrarVideo(){

            const video = document.getElementById("videoMarito");

            video.pause();

            video.currentTime = 0;

            document.getElementById("modalVideo").style.display = "none";
        }

    </script>

</body>

</html>
