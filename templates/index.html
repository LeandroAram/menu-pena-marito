<!DOCTYPE html>
<html>

<head>

    <title>La Peña de Marito</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            overflow:hidden;
        }

        .fondo{
            background-image:url('/static/pena3.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            position:relative;
        }

        .overlay{
            position:absolute;
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;
            padding:40px 20px;
            box-sizing:border-box;
        }

        h1{
            margin:0;
            margin-top:20px;
            color:white;
            font-size:58px;
            text-align:center;

            text-shadow:0px 4px 10px rgba(0,0,0,0.6);
        }

        .idiomas{
            width:100%;
            max-width:320px;

            display:flex;
            flex-direction:column;
            gap:14px;

            margin-bottom:30px;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:16px;

            font-size:20px;

            cursor:pointer;

            color:white;

            background:rgba(255,255,255,0.18);

            backdrop-filter:blur(4px);

            border:1px solid rgba(255,255,255,0.25);

            transition:0.3s;

            text-shadow:0px 2px 6px rgba(0,0,0,0.4);

        }

        .idioma-btn:hover{

            transform:scale(1.03);

            background:rgba(255,255,255,0.28);

        }

        @media(max-width:700px){

            h1{
                font-size:42px;
            }

            .idioma-btn{
                font-size:18px;
            }

        }

    </style>

</head>

<body>

    <div class="fondo">

        <div class="overlay">

            <h1>La Peña de Marito</h1>

            <div class="idiomas">

                <a href="/menu_es">
                    <button class="idioma-btn">
                        🇦🇷 Español
                    </button>
                </a>

                <a href="/menu_en">
                    <button class="idioma-btn">
                        🇺🇸 English
                    </button>
                </a>

                <a href="/menu_fr">
                    <button class="idioma-btn">
                        🇫🇷 Français
                    </button>
                </a>

                <a href="/menu_pt">
                    <button class="idioma-btn">
                        🇧🇷 Português
                    </button>
                </a>

            </div>

        </div>

    </div>

</body>

</html>
