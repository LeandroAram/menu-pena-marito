<!DOCTYPE html>
<html>

<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GW3WP50DQH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-GW3WP50DQH');
    </script>

    <title>La Peña de Marito</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            overflow:hidden;
        }

        .fondo{
            background-image:url('/static/pena3.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            position:relative;
        }

        .overlay{
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:flex-start;
            align-items:center;
            padding-top:50px;
            box-sizing:border-box;
        }

        .titulo{
            text-align:center;
            margin-top:20px;
        }

        h1{
            margin:0;
            font-size:62px;
            color:#f7d28b;
            letter-spacing:1px;
            text-shadow:0px 4px 10px rgba(0,0,0,0.55);
        }

        .subtitulo{
            margin-top:10px;
            color:white;
            font-size:20px;
            letter-spacing:2px;
            text-shadow:0px 2px 8px rgba(0,0,0,0.5);
        }

        .idiomas{
            display:flex;
            gap:12px;
            margin-top:25px;
            flex-wrap:wrap;
            justify-content:center;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{
            border:none;
            padding:12px 18px;
            border-radius:14px;
            font-size:17px;
            cursor:pointer;
            color:white;
            background:rgba(0,0,0,0.28);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            border:1px solid rgba(255,255,255,0.18);
            transition:0.3s;
            text-shadow:0px 2px 5px rgba(0,0,0,0.5);
        }

        .idioma-btn:hover{
            transform:translateY(-3px);
            background:rgba(0,0,0,0.42);
        }

        /* FIRMA DEL DESARROLLADOR */

        .firma{
            position:absolute;
            left:50%;
            transform:translateX(-50%);

            bottom:calc(220px + env(safe-area-inset-bottom));

            width:90%;

            text-align:center;

            color:rgba(255,255,255,0.88);

            font-size:12px;

            z-index:9998;

            text-shadow:0px 2px 6px rgba(0,0,0,0.9);
        }

        .firma a{
            color:#f7d28b;
            font-weight:bold;
            margin-left:8px;
            transition:0.3s;
        }

        .firma a:hover{
            color:white;
        }

        /* BOTONES PRINCIPALES */

        .acciones{
            position:absolute;
            left:50%;
            transform:translateX(-50%);

            bottom:calc(80px + env(safe-area-inset-bottom));

            display:grid;
            grid-template-columns:1fr 1fr;

            gap:12px;

            width:90%;
            max-width:520px;

            z-index:9999;
        }

        .whatsapp-btn,
        .video-btn,
        .instagram-btn,
        .maps-btn{

            display:block;

            width:100%;

            box-sizing:border-box;

            background:rgba(18,18,18,0.58);

            color:white;

            padding:14px 18px;

            border-radius:18px;

            font-size:17px;

            font-weight:bold;

            text-align:center;

            cursor:pointer;

            transition:all .30s ease;

            border:1px solid rgba(230,195,122,.45);

            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);

            text-shadow:0px 2px 6px rgba(0,0,0,.8);

            box-shadow:0px 8px 20px rgba(0,0,0,.35);
        }

        .whatsapp-btn:hover,
        .video-btn:hover,
        .instagram-btn:hover,
        .maps-btn:hover{

            transform:translateY(-3px);

            background:#8B5A2B;

            border-color:#E6C37A;

            box-shadow:0px 10px 28px rgba(0,0,0,.45);
        }

        /* FRASE INFERIOR */

        .frase-final{
            position:absolute;

            left:50%;

            transform:translateX(-50%);

            bottom:calc(25px + env(safe-area-inset-bottom));

            width:90%;

            text-align:center;

            color:white;

            font-size:15px;

            font-weight:bold;

            text-shadow:0px 3px 8px rgba(0,0,0,0.85);

            z-index:9998;
        }

        /* VIDEO */

        .modal-video{
            display:none;

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.92);

            z-index:10000;

            justify-content:center;

            align-items:center;
        }

        .modal-contenido{
            width:90%;
            max-width:420px;
            position:relative;
        }

        .modal-contenido video{
            width:100%;
            border-radius:20px;
        }

        .cerrar-video{
            position:absolute;

            top:15px;
            right:15px;

            background:rgba(0,0,0,0.7);

            color:white;

            border:none;

            width:45px;
            height:45px;

            border-radius:50%;

            font-size:24px;

            cursor:pointer;

            z-index:10001;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        /* CELULARES */

        @media(max-width:700px){

            h1{
                font-size:42px;
            }

            .subtitulo{
                font-size:16px;
            }

            .idiomas{
                gap:10px;
            }

            .idioma-btn{
                font-size:15px;
                padding:10px 14px;
            }

            .firma{
                bottom:calc(220px + env(safe-area-inset-bottom));
                font-size:11px;
            }

            .acciones{
                bottom:calc(80px + env(safe-area-inset-bottom));

                grid-template-columns:1fr 1fr;

                gap:10px;

                width:90%;
            }

            .whatsapp-btn,
            .video-btn,
            .instagram-btn,
            .maps-btn{

                font-size:15px;

                padding:12px 10px;
            }

            .frase-final{
                font-size:13px;

                bottom:calc(25px + env(safe-area-inset-bottom));
            }
        }

    </style>

</head>

<body>

    <div class="fondo">

        <div class="overlay">

            <div class="titulo">

                <h1>La Peña de Marito</h1>

                <div class="subtitulo">
                    Seleccione su idioma
                </div>

                <div class="idiomas">

                    <a href="/menu_es">

                        <button class="idioma-btn">
                            🇦🇷 Español
                        </button>

                    </a>

                    <a href="/menu_en">

                        <button class="idioma-btn">
                            🇺🇸 English
                        </button>

                    </a>

                    <a href="/menu_fr">

                        <button class="idioma-btn">
                            🇫🇷 Français
                        </button>

                    </a>

                    <a href="/menu_pt">

                        <button class="idioma-btn">
                            🇧🇷 Português
                        </button>

                    </a>

                </div>

            </div>

        </div>


        <!-- FIRMA DEL DESARROLLADOR -->

        <div class="firma">

            Diseño Web · Leandro

            <a
                href="https://www.instagram.com/leandro_aramayo1/"
                target="_blank"
                aria-label="Instagram de Leandro">

                📸

            </a>

            <a
                href="https://wa.me/5493886865324?text=Hola%20Leandro,%20vi%20la%20página%20de%20La%20Peña%20de%20Marito%20y%20quería%20consultarte."
                target="_blank"
                aria-label="WhatsApp de Leandro">

                💬

            </a>

        </div>


        <!-- BOTONES PRINCIPALES -->

        <div class="acciones">

            <a
                href="https://wa.me/5493886827704?text=Hola%20La%20Peña%20de%20Marito,%20quiero%20realizar%20una%20reserva."
                target="_blank">

                <div class="whatsapp-btn">
                    📲 Reservar
                </div>

            </a>


            <button
                class="video-btn"
                onclick="abrirVideo()">

                ▶ Ver la Peña

            </button>


            <a
                href="https://www.instagram.com/restomarito.purma/"
                target="_blank">

                <div class="instagram-btn">
                    📸 Instagram
                </div>

            </a>


            <a
                href="https://maps.app.goo.gl/LBAqsRqPrycpqDnn7?g_st=ic"
                target="_blank">

                <div class="maps-btn">
                    📍 Cómo llegar
                </div>

            </a>

        </div>


        <!-- FRASE -->

        <div class="frase-final">

            🎶 Música en vivo • Comida regional • Tradición jujeña

        </div>

    </div>


    <!-- VIDEO -->

    <div
        class="modal-video"
        id="modalVideo">

        <div class="modal-contenido">

            <button
                class="cerrar-video"
                onclick="cerrarVideo()">

                ✕

            </button>

            <video
                id="videoMarito"
                controls
                playsinline
                webkit-playsinline
                preload="metadata">

                <source
                    src="/static/videos/experiencia-marito.mp4"
                    type="video/mp4">

            </video>

        </div>

    </div>


    <script>

        function abrirVideo(){

            const modal =
                document.getElementById("modalVideo");

            const video =
                document.getElementById("videoMarito");

            modal.style.display = "flex";

            video.currentTime = 0;

            video.play().catch(() => {});

        }


        function cerrarVideo(){

            const video =
                document.getElementById("videoMarito");

            video.pause();

            video.currentTime = 0;

            document.getElementById("modalVideo").style.display = "none";

        }


        /* También permite cerrar tocando fuera del video */

        document.getElementById("modalVideo")
            .addEventListener("click", function(event){

                if(event.target === this){
                    cerrarVideo();
                }

            });

    </script>

</body>

</html>
