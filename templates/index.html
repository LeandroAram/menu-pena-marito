<!DOCTYPE html>
<html>

<head>

    <title>La Peña de Marito</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            color:white;
            text-align:center;
        }

        .fondo{
            background-image:url('/static/pena2.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .contenido{
            background:rgba(0,0,0,0.35);
            padding:40px;
            border-radius:20px;
            width:90%;
            max-width:500px;
        }

        h1{
            font-size:60px;
            color:#ffae00;
            margin-bottom:10px;
        }

        h2{
            margin-bottom:30px;
        }

        p{
            font-size:22px;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{
            padding:15px 30px;
            border:none;
            border-radius:10px;
            font-size:22px;
            cursor:pointer;
            background:#ff8800;
            color:white;
            font-weight:bold;
            margin-top:20px;
            width:250px;
        }

        .idiomas{
            display:flex;
            flex-direction:column;
            gap:15px;
            align-items:center;
            margin-top:30px;
        }

    </style>

</head>

<body>

    <div class="fondo">

        <div class="contenido">

            <h1>La Peña de Marito</h1>

            <h2>Bienvenido</h2>

            <p>Seleccione su idioma</p>

            <div class="idiomas">

                <a href="/menu_es">
                    <button class="idioma-btn">
                        🇦🇷 Español
                    </button>
                </a>

                <a href="/menu_en">
                    <button class="idioma-btn">
                        🇺🇸 English
                    </button>
                </a>

                <a href="/menu_fr">
                    <button class="idioma-btn">
                        🇫🇷 Français
                    </button>
                </a>

                <a href="/menu_pt">
                    <button class="idioma-btn">
                        🇧🇷 Português
                    </button>
                </a>

            </div>

        </div>

    </div>

</body>

</html>
