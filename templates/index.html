<!DOCTYPE html>
<html>

<head>

    <title>La Peña de Marito</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            overflow:hidden;
        }

        .fondo{
            background-image:url('/static/pena3.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            position:relative;
        }

        .overlay{
            width:100%;
            height:100%;

            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;

            padding:40px 20px;

            box-sizing:border-box;
        }

        .titulo{

            text-align:center;

            margin-top:20px;

        }

        h1{
            margin:0;

            font-size:62px;

            color:#f7d28b;

            letter-spacing:1px;

            text-shadow:0px 4px 10px rgba(0,0,0,0.55);
        }

        .subtitulo{

            margin-top:10px;

            color:white;

            font-size:20px;

            letter-spacing:2px;

            text-shadow:0px 2px 8px rgba(0,0,0,0.5);
        }

        .idiomas{

            display:flex;

            gap:12px;

            margin-bottom:35px;

            flex-wrap:wrap;

            justify-content:center;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{

            border:none;

            padding:12px 18px;

            border-radius:14px;

            font-size:17px;

            cursor:pointer;

            color:white;

            background:rgba(0,0,0,0.28);

            backdrop-filter:blur(4px);

            border:1px solid rgba(255,255,255,0.18);

            transition:0.3s;

            text-shadow:0px 2px 5px rgba(0,0,0,0.5);
        }

        .idioma-btn:hover{

            transform:translateY(-3px);

            background:rgba(0,0,0,0.42);
        }

        @media(max-width:700px){

            h1{
                font-size:42px;
            }

            .subtitulo{
                font-size:16px;
            }

            .idiomas{
                gap:10px;
            }

            .idioma-btn{
                font-size:15px;
                padding:10px 14px;
            }

        }

    </style>

</head>

<body>

    <div class="fondo">

        <div class="overlay">

            <div class="titulo">

                <h1>La Peña de Marito</h1>

                <div class="subtitulo">
                    Seleccione su idioma
                </div>

            </div>

            <div class="idiomas">

                <a href="/menu_es">
                    <button class="idioma-btn">
                        🇦🇷 Español
                    </button>
                </a>

                <a href="/menu_en">
                    <button class="idioma-btn">
                        🇺🇸 English
                    </button>
                </a>

                <a href="/menu_fr">
                    <button class="idioma-btn">
                        🇫🇷 Français
                    </button>
                </a>

                <a href="/menu_pt">
                    <button class="idioma-btn">
                        🇧🇷 Português
                    </button>
                </a>

            </div>

        </div>

    </div>

</body>

</html>
