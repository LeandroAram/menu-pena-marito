<!DOCTYPE html>
<html>

<head>

    <title>La Peña de Marito</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            overflow:hidden;
        }

        .fondo{
            background-image:url('/static/pena3.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
            position:relative;
        }

        .overlay{

            width:100%;
            height:100%;

            display:flex;
            flex-direction:column;
            justify-content:flex-start;

            align-items:center;

            padding-top:50px;

            box-sizing:border-box;
        }

        .titulo{

            text-align:center;

            margin-top:20px;

        }

        h1{
            margin:0;

            font-size:62px;

            color:#f7d28b;

            letter-spacing:1px;

            text-shadow:0px 4px 10px rgba(0,0,0,0.55);
        }

        .subtitulo{

            margin-top:10px;

            color:white;

            font-size:20px;

            letter-spacing:2px;

            text-shadow:0px 2px 8px rgba(0,0,0,0.5);
        }

        .idiomas{

            display:flex;

            gap:12px;

            margin-top:25px;

            flex-wrap:wrap;

            justify-content:center;
        }

        a{
            text-decoration:none;
        }

        .idioma-btn{

            border:none;

            padding:12px 18px;

            border-radius:14px;

            font-size:17px;

            cursor:pointer;

            color:white;

            background:rgba(0,0,0,0.28);

            backdrop-filter:blur(4px);

            border:1px solid rgba(255,255,255,0.18);

            transition:0.3s;

            text-shadow:0px 2px 5px rgba(0,0,0,0.5);
        }

        .idioma-btn:hover{

            transform:translateY(-3px);

            background:rgba(0,0,0,0.42);
        }

        .reservas{

            position:absolute;

            left:50%;

            transform:translateX(-50%);

            text-align:center;

            bottom:calc(90px + env(safe-area-inset-bottom));

            z-index:9999;
        }

        .reservas-texto{

            color:white;

            font-size:18px;

            margin-bottom:12px;

            text-shadow:0px 2px 8px rgba(0,0,0,0.8);
        }

        .whatsapp-btn{

            display:inline-block;

            background:#25D366;

            color:white;

            padding:14px 24px;

            border-radius:16px;

            font-size:18px;

            font-weight:bold;

            box-shadow:0px 0px 18px rgba(37,211,102,0.7);

            transition:0.3s;

            animation:brillo 2s infinite;
        }

        .whatsapp-btn:hover{

            transform:scale(1.05);
        }

        @keyframes brillo{

            0%{
                box-shadow:0px 0px 10px rgba(37,211,102,0.4);
            }

            50%{
                box-shadow:0px 0px 25px rgba(37,211,102,1);
            }

            100%{
                box-shadow:0px 0px 10px rgba(37,211,102,0.4);
            }

        }

        @media(max-width:700px){

    h1{
        font-size:42px;
    }

    .subtitulo{
        font-size:16px;
    }

    .idiomas{
        gap:10px;
    }

    .idioma-btn{
        font-size:15px;
        padding:10px 14px;
    }

    .whatsapp-btn{
        font-size:16px;
        padding:12px 18px;
    }

    .reservas{
        bottom:calc(120px + env(safe-area-inset-bottom));
    }

}

    </style>

</head>

<body>

    <div class="fondo">

        <div class="overlay">

            <div class="titulo">

                <h1>La Peña de Marito</h1>

                <div class="subtitulo">
                    Seleccione su idioma
                </div>

                <div class="idiomas">

                    <a href="/menu_es">
                        <button class="idioma-btn">
                            🇦🇷 Español
                        </button>
                    </a>

                    <a href="/menu_en">
                        <button class="idioma-btn">
                            🇺🇸 English
                        </button>
                    </a>

                    <a href="/menu_fr">
                        <button class="idioma-btn">
                            🇫🇷 Français
                        </button>
                    </a>

                    <a href="/menu_pt">
                        <button class="idioma-btn">
                            🇧🇷 Português
                        </button>
                    </a>

                </div>

            </div>

        </div>

        <div class="reservas">
            
            <a href="https://wa.me/5493886827704?text=Hola%20La%20Peña%20de%20Marito,%20quiero%20realizar%20una%20reserva."
               target="_blank">

                <div class="whatsapp-btn">
                    Reservar por WhatsApp
                </div>

            </a>

        </div>

    </div>

</body>

</html>
