<!DOCTYPE html>
<html>

<head>

    <title>Platos Regionales</title>

    <style>

        body{
            margin:0;
            padding:20px;
            font-family:Arial;
            background:#f5e6c8;
        }

        h1{
            text-align:center;
            color:#8b4513;
            font-size:45px;
        }

        .volver{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:#8b4513;
            color:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:bold;
        }

        .card-comida{
            background:white;
            border-radius:20px;
            margin-top:20px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.2);
            display:flex;
            overflow:hidden;
            align-items:center;
        }

        .card-comida img{
            width:160px;
            height:160px;
            object-fit:cover;
            cursor:pointer;
        }

        .info{
            padding:15px;
        }

        .info h3{
            margin:0;
            color:#8b4513;
            font-size:28px;
        }

        .info p{
            color:#555;
            font-size:16px;
            margin-top:10px;
        }

        .info h4{
            color:#b22222;
            font-size:26px;
        }

        .visor{
            display:none;
            position:fixed;
            z-index:5000;
            padding-top:50px;
            left:0;
            top:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.9);
        }

        .visor img{
            margin:auto;
            display:block;
            width:90%;
            max-width:700px;
            border-radius:20px;
        }

    </style>

</head>

<body>

    <a href="/menu_es" class="volver">
        ← Volver
    </a>

    <h1>🦙 Platos Regionales</h1>

    <div class="card-comida">

        <img src="/static/comidas/locro.jpg" onclick="abrirImagen(this.src)">

        <div class="info">

            <h3>🦙 Locro Norteño</h3>

            <p>
                Tradicional guiso argentino elaborado con maíz blanco,
                carne vacuna y sabores regionales del norte.
            </p>

            <h4>$17500</h4>

        </div>

    </div>

    <div id="visor" class="visor" onclick="cerrarImagen()">

        <img id="imagen-grande">

    </div>

    <script>

        function abrirImagen(src){

            document.getElementById("visor").style.display = "block";

            document.getElementById("imagen-grande").src = src;

        }

        function cerrarImagen(){

            document.getElementById("visor").style.display = "none";

        }

    </script>

</body>

</html>
