<!DOCTYPE html>
<html>

<head>

    <title>Categories</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
    margin:0;
    padding:15px;
    font-family:Arial;
    overflow-x:hidden;

    background-image:url('/static/categorias/fondo-categorias.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

h1{
    text-align:center;
    color:white;
    font-size:38px;
    margin:15px 0 20px 0;
    text-shadow:0 3px 8px rgba(0,0,0,0.7);
}

.categoria-img{
    position:relative;
    margin-bottom:16px;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.35);

    opacity:0;

    width:100%;
    max-width:100%;
}

.categoria-img img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    color:white;
    font-size:28px;
    font-weight:bold;
    text-align:center;

    text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

.horario{
    font-size:16px;
    margin-top:8px;
    color:#ffd27f;
}

.volver{
    display:inline-block;
    margin-bottom:18px;

    text-decoration:none;

    background:rgba(139,69,19,0.9);
    color:white;

    padding:10px 18px;
    border-radius:12px;

    font-weight:bold;
    backdrop-filter:blur(6px);
}

@media(max-width:700px){

    body{
        padding:12px;
    }

    h1{
        font-size:32px;
        margin-bottom:18px;
    }

    .categoria-img{
        margin-bottom:14px;
        border-radius:16px;
    }

    .categoria-img img{
        height:135px;
    }

    .overlay{
        font-size:22px;
        padding:10px;
    }

    .horario{
        font-size:14px;
    }
}

        /* ANIMATIONS */

        .izquierda{
            animation:izquierda 1s forwards;
        }

        .derecha{
            animation:derecha 1s forwards;
        }

        .delay1{
            animation-delay:0.2s;
        }

        .delay2{
            animation-delay:0.4s;
        }

        .delay3{
            animation-delay:0.6s;
        }

        .delay4{
            animation-delay:0.8s;
        }

        .delay5{
            animation-delay:1s;
        }

        .delay6{
            animation-delay:1.2s;
        }

        @keyframes izquierda{

            from{
                opacity:0;
                transform:translateX(-120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        @keyframes derecha{

            from{
                opacity:0;
                transform:translateX(120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        @media(max-width:700px){

            h1{
                font-size:34px;
            }

            .overlay{
                font-size:24px;
            }

            .categoria-img img{
                height:150px;
            }

            .favoritos{
                font-size:14px;
                padding:10px;
            }

            .horario{
                font-size:16px;
            }
        }

    </style>

</head>

<body>

    <a href="/" class="volver">
        ← Back
    </a>

    <h1>🍽️ Categories</h1>

    <div class="favoritos">
        🔥 <strong>Visitors' Favorites:</strong>
        Empanadas • Llama Stew • Quesillo with Cayote
    </div>

    <a href="/regionales_en">

        <div class="categoria-img izquierda delay1">

            <img src="/static/categorias/regionales.jpg">

            <div class="overlay">

                🦙 Regional Dishes

            </div>

        </div>

    </a>

    <a href="/tradicionales_en">

        <div class="categoria-img derecha delay2">

            <img src="/static/categorias/tradicionales.jpg">

            <div class="overlay">

                🍽️ Traditional Dishes

            </div>

        </div>

    </a>

    <a href="/pastas_en">

        <div class="categoria-img izquierda delay3">

            <img src="/static/categorias/pastas.jpg">

            <div class="overlay">

                🍝 Pasta

            </div>

        </div>

    </a>

    <a href="/entradas_en">

        <div class="categoria-img derecha delay4">

            <img src="/static/categorias/entradas.jpg">

            <div class="overlay">

                🥟 Starters

            </div>

        </div>

    </a>

    <a href="/postres_en">

        <div class="categoria-img izquierda delay5">

            <img src="/static/categorias/postres.jpg">

            <div class="overlay">

                🍰 Desserts

            </div>

        </div>

    </a>

    <a href="/menu-dia_en">

        <div class="categoria-img derecha delay6">

            <img src="/static/categorias/menu.jpg">

            <div class="overlay">

                🍽️ Daily Menu

                <div class="horario">
                    🕚 11 AM to 4 PM
                </div>

            </div>

        </div>

    </a>

</body>

</html>
