<!DOCTYPE html>
<html>

<head>

    <title>Categories</title>

    <style>

        body{
            margin:0;
            padding:20px;
            background:#f5e6c8;
            font-family:Arial;
            overflow-x:hidden;
        }

        h1{
            text-align:center;
            color:#8b4513;
            font-size:50px;
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
        }

        .categoria-img{
            position:relative;
            margin-bottom:25px;
            overflow:hidden;
            border-radius:20px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.3);

            opacity:0;

            width:100%;
            max-width:100%;
        }

        .categoria-img img{
            width:100%;
            height:230px;
            object-fit:cover;
            display:block;
        }

        .overlay{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.45);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:38px;
            font-weight:bold;
            text-align:center;
            flex-direction:column;
        }

        .horario{
            font-size:22px;
            margin-top:10px;
            color:#ffd27f;
        }

        .volver{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:#8b4513;
            color:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:bold;
        }

        /* ANIMATIONS */

        .izquierda{
            animation:izquierda 1s forwards;
        }

        .derecha{
            animation:derecha 1s forwards;
        }

        .delay1{
            animation-delay:0.2s;
        }

        .delay2{
            animation-delay:0.5s;
        }

        .delay3{
            animation-delay:0.8s;
        }

        .delay4{
            animation-delay:1.1s;
        }

        .delay5{
            animation-delay:1.4s;
        }

        .delay6{
            animation-delay:1.7s;
        }

        @keyframes izquierda{

            from{
                opacity:0;
                transform:translateX(-120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        @keyframes derecha{

            from{
                opacity:0;
                transform:translateX(120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

    </style>

</head>

<body>

    <a href="/" class="volver">
        ← Back
    </a>

    <h1>🍽️ Categories</h1>

    <a href="/regionales_en">

        <div class="categoria-img izquierda delay1">

            <img src="/static/categorias/regionales.jpg">

            <div class="overlay">

                🦙 Regional Dishes

            </div>

        </div>

    </a>

    <a href="/tradicionales_en">

        <div class="categoria-img derecha delay2">

            <img src="/static/categorias/tradicionales.jpg">

            <div class="overlay">

                🍽️ Traditional Dishes

            </div>

        </div>

    </a>

    <a href="/pastas_en">

        <div class="categoria-img izquierda delay3">

            <img src="/static/categorias/pastas.jpg">

            <div class="overlay">

                🍝 Pasta

            </div>

        </div>

    </a>

    <a href="/entradas_en">

        <div class="categoria-img derecha delay4">

            <img src="/static/categorias/entradas.jpg">

            <div class="overlay">

                🥟 Starters

            </div>

        </div>

    </a>

    <a href="/postres_en">

        <div class="categoria-img izquierda delay5">

            <img src="/static/categorias/postres.jpg">

            <div class="overlay">

                🍰 Desserts

            </div>

        </div>

    </a>

    <a href="/menu-dia_en">

        <div class="categoria-img derecha delay6">

            <img src="/static/categorias/menu.jpg">

            <div class="overlay">

                🍽️ Daily Menu

                <div class="horario">
                    🕚 11 AM to 4 PM
                </div>

            </div>

        </div>

    </a>

</body>

</html>
