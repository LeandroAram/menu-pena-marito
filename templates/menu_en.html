<!DOCTYPE html>
<html>

<head>

    <title>Categories</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            margin:0;
            padding:20px;
            font-family:Arial;
            overflow-x:hidden;

            background:
                linear-gradient(
                    rgba(0,0,0,0.45),
                    rgba(0,0,0,0.45)
                ),
                url('/static/fondos/purmamarca.jpg');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;
        }

        h1{
            text-align:center;
            color:#f7d28b;
            font-size:50px;
            margin-bottom:20px;
            text-shadow:0px 4px 10px rgba(0,0,0,0.8);
        }

        .favoritos{
            max-width:900px;
            margin:0 auto 30px auto;

            background:rgba(0,0,0,0.45);
            backdrop-filter:blur(6px);

            color:white;
            text-align:center;

            padding:14px 20px;

            border-radius:16px;

            font-size:18px;

            border:1px solid rgba(255,255,255,0.15);

            box-shadow:0px 4px 15px rgba(0,0,0,0.3);
        }

        a{
            text-decoration:none;
        }

        .categoria-img{
            position:relative;
            margin-bottom:25px;
            overflow:hidden;
            border-radius:20px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.4);

            opacity:0;

            width:100%;
            max-width:100%;
        }

        .categoria-img img{
            width:100%;
            height:230px;
            object-fit:cover;
            display:block;
        }

        .overlay{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.45);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:38px;
            font-weight:bold;
            text-align:center;
            flex-direction:column;
            text-shadow:0px 3px 8px rgba(0,0,0,0.8);
        }

        .horario{
            font-size:22px;
            margin-top:10px;
            color:#ffd27f;
        }

        .volver{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:rgba(139,69,19,0.9);
            color:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:bold;
            backdrop-filter:blur(6px);
        }

        .destacado{
            position:absolute;
            top:15px;
            right:15px;

            background:#f7d28b;
            color:#5a2e0c;

            padding:8px 14px;

            border-radius:20px;

            font-size:15px;
            font-weight:bold;

            z-index:5;

            box-shadow:0px 3px 10px rgba(0,0,0,0.3);
        }

        .izquierda{
            animation:izquierda 1s forwards;
        }

        .derecha{
            animation:derecha 1s forwards;
        }

        .delay1{
            animation-delay:0.2s;
        }

        .delay2{
            animation-delay:0.5s;
        }

        .delay3{
            animation-delay:0.8s;
        }

        .delay4{
            animation-delay:1.1s;
        }

        .delay5{
            animation-delay:1.4s;
        }

        .delay6{
            animation-delay:1.7s;
        }

        @keyframes izquierda{

            from{
                opacity:0;
                transform:translateX(-120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        @keyframes derecha{

            from{
                opacity:0;
                transform:translateX(120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        @media(max-width:700px){

            h1{
                font-size:40px;
            }

            .overlay{
                font-size:30px;
            }

            .favoritos{
                font-size:15px;
            }

            .destacado{
                font-size:13px;
                padding:6px 10px;
            }

        }

    </style>

</head>

<body>

    <a href="/" class="volver">
        ← Back
    </a>

    <h1>🍽️ Categories</h1>

    <div class="favoritos">
        🔥 Visitors' favorites:
        🥟 Regional Empanadas · 🦙 Llama Stew · 🍰 Quesillo with Cayote
    </div>

    <a href="/regionales_en">

        <div class="categoria-img izquierda delay1">

            <div class="destacado">
                ⭐ Most Popular
            </div>

            <img src="/static/categorias/regionales.jpg">

            <div class="overlay">

                🦙 Regional Dishes

            </div>

        </div>

    </a>

    <a href="/tradicionales_en">

        <div class="categoria-img derecha delay2">

            <img src="/static/categorias/tradicionales.jpg">

            <div class="overlay">

                🍽️ Traditional Dishes

            </div>

        </div>

    </a>

    <a href="/pastas_en">

        <div class="categoria-img izquierda delay3">

            <img src="/static/categorias/pastas.jpg">

            <div class="overlay">

                🍝 Pasta

            </div>

        </div>

    </a>

    <a href="/entradas_en">

        <div class="categoria-img derecha delay4">

            <img src="/static/categorias/entradas.jpg">

            <div class="overlay">

                🥟 Starters

            </div>

        </div>

    </a>

    <a href="/postres_en">

        <div class="categoria-img izquierda delay5">

            <div class="destacado">
                ❤️ Favorite Dessert
            </div>

            <img src="/static/categorias/postres.jpg">

            <div class="overlay">

                🍰 Desserts

            </div>

        </div>

    </a>

    <a href="/menu-dia_en">

        <div class="categoria-img derecha delay6">

            <div class="destacado">
                🔥 Recommended
            </div>

            <img src="/static/categorias/menu.jpg">

            <div class="overlay">

                🍽️ Daily Menu

                <div class="horario">
                    🕚 11 AM to 4 PM
                </div>

            </div>

        </div>

    </a>

</body>

</html>
