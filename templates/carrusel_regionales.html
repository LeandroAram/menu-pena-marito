<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrusel de Platos Regionales</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090705;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font-family: inherit;
        }

        .carrusel {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #090705;
        }

        /* =====================================
           IMAGEN PRINCIPAL
        ===================================== */

        .imagen-principal {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            opacity: 1;
            transform: scale(1);

            transition: opacity 0.7s ease;
        }

        .imagen-principal.animando {
            animation: acercamiento 6.5s linear forwards;
        }

        @keyframes acercamiento {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.035);
            }
        }

        /* =====================================
           SOMBRAS
        ===================================== */

        .capa-oscura {
            position: absolute;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.93) 0%,
                    rgba(0, 0, 0, 0.72) 25%,
                    rgba(0, 0, 0, 0.18) 55%,
                    rgba(0, 0, 0, 0.05) 100%
                ),
                linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.96) 0%,
                    rgba(0, 0, 0, 0.45) 22%,
                    transparent 48%
                );
        }

        .capa-superior {
            position: absolute;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.55) 0%,
                    transparent 30%
                );
        }

        /* =====================================
           MARCA
        ===================================== */

        .marca {
            position: absolute;
            top: 32px;
            left: 54px;
            z-index: 20;

            color: white;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.9);
        }

        .marca-superior {
            display: block;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 21px;
            font-weight: bold;
        }

        .marca-principal {
            display: block;

            margin-top: -5px;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 52px;
            font-style: italic;
            font-weight: bold;
            line-height: 1;
        }

        .marca-lugar {
            display: block;

            margin-top: 8px;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* =====================================
           TÍTULO SUPERIOR
        ===================================== */

        .titulo-superior {
            position: absolute;
            top: 44px;
            right: 54px;
            z-index: 20;

            color: #efbd4d;

            font-size: 17px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.9);
        }

        .titulo-superior::after {
            content: "";

            display: block;

            width: 100%;
            height: 2px;

            margin-top: 11px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #efbd4d,
                    transparent
                );
        }

        /* =====================================
           PANTALLA COMPLETA
        ===================================== */

        .boton-pantalla-completa {
            position: absolute;
            top: 100px;
            right: 54px;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-width: 220px;
            min-height: 50px;

            padding: 12px 22px;

            border: 2px solid #efbd4d;
            border-radius: 28px;

            color: #efbd4d;
            background: rgba(0, 0, 0, 0.80);

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;

            cursor: pointer;

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .boton-pantalla-completa:hover,
        .boton-pantalla-completa:focus {
            color: #17100b;
            background: #efbd4d;
            transform: scale(1.05);

            outline: 4px solid white;
            outline-offset: 3px;
        }

        .boton-pantalla-completa.oculto {
            display: none;
        }

        /* =====================================
           INFORMACIÓN
        ===================================== */

        .informacion {
            position: absolute;
            top: 47%;
            left: 8%;
            z-index: 20;

            width: min(590px, 43vw);

            transform: translateY(-50%);
        }

        .categoria {
            margin-bottom: 15px;

            color: #efbd4d;

            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nombre-plato {
            color: white;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 5vw, 74px);
            font-weight: bold;
            line-height: 1.04;

            text-shadow:
                0 4px 22px rgba(0, 0, 0, 0.90);
        }

        .nombre-plato.animando {
            animation: aparecerNombre 0.9s ease forwards;
        }

        @keyframes aparecerNombre {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .linea-dorada {
            width: 130px;
            height: 4px;

            margin-top: 27px;

            background: #efbd4d;

            transform-origin: left;
        }

        .linea-dorada.animando {
            animation: aparecerLinea 0.9s ease 0.25s both;
        }

        @keyframes aparecerLinea {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* =====================================
           FLECHAS PRINCIPALES
        ===================================== */

        .flecha {
            position: absolute;
            top: 47%;
            z-index: 40;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 68px;
            height: 68px;

            border: 2px solid #efbd4d;
            border-radius: 50%;

            color: #efbd4d;
            background: rgba(0, 0, 0, 0.30);

            font-size: 42px;
            line-height: 1;

            cursor: pointer;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transition:
                transform 0.25s ease,
                color 0.25s ease,
                background 0.25s ease;
        }

        .flecha:hover,
        .flecha:focus {
            color: #17100b;
            background: #efbd4d;
            transform: scale(1.08);

            outline: 4px solid white;
            outline-offset: 3px;
        }

        .flecha-anterior {
            left: 27px;
        }

        .flecha-siguiente {
            right: 27px;
        }

        /* =====================================
           MINIATURAS
        ===================================== */

        .zona-miniaturas {
            position: absolute;
            left: 50%;
            bottom: 42px;
            z-index: 30;

            width: calc(100% - 150px);

            transform: translateX(-50%);
        }

        .miniaturas {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 13px;

            width: 100%;

            padding:
                12px
                12px
                8px;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .miniaturas::-webkit-scrollbar {
            display: none;
        }

        .miniatura {
            flex: 0 0 106px;

            color: white;
            text-align: center;

            opacity: 0.64;
            cursor: pointer;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .miniatura:hover,
        .miniatura:focus {
            opacity: 1;
            transform: translateY(-6px);
            outline: none;
        }

        .miniatura-imagen {
            display: block;

            width: 82px;
            height: 82px;

            margin: auto;

            object-fit: cover;

            border: 2px solid rgba(239, 189, 77, 0.55);
            border-radius: 50%;

            transition:
                border 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .miniatura.activa {
            opacity: 1;
        }

        .miniatura.activa .miniatura-imagen {
            border: 4px solid #efbd4d;

            transform: scale(1.09);

            box-shadow:
                0 5px 24px rgba(0, 0, 0, 0.90);
        }

        .miniatura-nombre {
            display: block;

            margin-top: 9px;

            font-size: 11px;
            font-weight: bold;
            line-height: 1.15;

            text-shadow:
                0 2px 8px black;
        }

        .miniatura.activa .miniatura-nombre {
            color: #f8d681;
        }

        /* =====================================
           INDICADORES
        ===================================== */

        .indicadores {
            position: absolute;
            left: 50%;
            bottom: 14px;
            z-index: 35;

            display: flex;
            gap: 7px;

            transform: translateX(-50%);
        }

        .punto {
            width: 8px;
            height: 8px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.42);

            cursor: pointer;

            transition:
                width 0.3s ease,
                border-radius 0.3s ease,
                background 0.3s ease;
        }

        .punto.activo {
            width: 25px;
            border-radius: 7px;
            background: #efbd4d;
        }

        /* =====================================
           MENSAJE PANTALLA COMPLETA
        ===================================== */

        .mensaje-pantalla {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 9999;

            display: none;

            width: min(520px, 85%);

            padding: 25px;

            border: 2px solid #efbd4d;
            border-radius: 18px;

            color: white;
            background: rgba(0, 0, 0, 0.95);

            text-align: center;
            font-size: 18px;
            line-height: 1.5;

            transform: translate(-50%, -50%);
        }

        .mensaje-pantalla.visible {
            display: block;
        }

        .cerrar-mensaje {
            margin-top: 18px;
            padding: 10px 25px;

            border: none;
            border-radius: 20px;

            color: #17100b;
            background: #efbd4d;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        /* =====================================
           PANTALLAS MEDIANAS
        ===================================== */

        @media (max-width: 1100px) {
            .miniatura {
                flex-basis: 86px;
            }

            .miniatura-imagen {
                width: 68px;
                height: 68px;
            }

            .miniatura-nombre {
                display: none;
            }

            .informacion {
                width: 46vw;
            }
        }

        /* =====================================
           CELULARES
        ===================================== */

        @media (max-width: 700px) {
            .marca {
                top: 22px;
                left: 22px;
            }

            .marca-principal {
                font-size: 39px;
            }

            .titulo-superior {
                display: none;
            }

            .boton-pantalla-completa {
                top: 22px;
                right: 18px;

                min-width: auto;
                min-height: 43px;

                padding: 9px 14px;

                font-size: 11px;
            }

            .informacion {
                top: 55%;
                left: 12%;

                width: 75%;
            }

            .nombre-plato {
                font-size: 40px;
            }

            .flecha {
                width: 50px;
                height: 50px;

                font-size: 30px;
            }

            .flecha-anterior {
                left: 10px;
            }

            .flecha-siguiente {
                right: 10px;
            }

            .zona-miniaturas {
                bottom: 23px;
                width: calc(100% - 40px);
            }

            .miniatura {
                flex-basis: 69px;
            }

            .miniatura-imagen {
                width: 58px;
                height: 58px;
            }

            .indicadores {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main
        id="carrusel"
        class="carrusel"
    >

        <!-- IMAGEN PRINCIPAL -->

        <img
            id="imagenPrincipal"
            class="imagen-principal animando"
            src="{{ url_for('static', filename='carrusel_regionales/locro.png') }}"
            alt="Locro norteño"
        >

        <div class="capa-oscura"></div>
        <div class="capa-superior"></div>

        <!-- MARCA -->

        <div class="marca">

            <span class="marca-superior">
                La Peña de
            </span>

            <span class="marca-principal">
                Marito
            </span>

            <span class="marca-lugar">
                PURMAMARCA
            </span>

        </div>

        <!-- TÍTULO -->

        <div class="titulo-superior">
            Carrusel de regionales
        </div>

        <!-- PANTALLA COMPLETA -->

        <button
            id="botonPantallaCompleta"
            class="boton-pantalla-completa"
            type="button"
        >
            ⛶ PANTALLA COMPLETA
        </button>

        <!-- INFORMACIÓN -->

        <section class="informacion">

            <p class="categoria">
                Platos regionales
            </p>

            <h1
                id="nombrePlato"
                class="nombre-plato animando"
            >
                Locro norteño
            </h1>

            <div
                id="lineaDorada"
                class="linea-dorada animando"
            ></div>

        </section>

        <!-- FLECHAS -->

        <button
            id="anterior"
            class="flecha flecha-anterior"
            type="button"
            aria-label="Plato anterior"
        >
            ‹
        </button>

        <button
            id="siguiente"
            class="flecha flecha-siguiente"
            type="button"
            aria-label="Siguiente plato"
        >
            ›
        </button>

        <!-- MINIATURAS -->

        <div class="zona-miniaturas">

            <div
                id="miniaturas"
                class="miniaturas"
            ></div>

        </div>

        <!-- INDICADORES -->

        <div
            id="indicadores"
            class="indicadores"
        ></div>

    </main>

    <!-- MENSAJE DE ERROR -->

    <div
        id="mensajePantalla"
        class="mensaje-pantalla"
    >
        <p>
            Este navegador no permitió activar la pantalla completa.
        </p>

        <button
            id="cerrarMensaje"
            class="cerrar-mensaje"
            type="button"
        >
            Cerrar
        </button>
    </div>

    <script>
        const platos = [
            {
                nombre: "Locro norteño",
                nombreCorto: "Locro",
                imagen: "{{ url_for('static', filename='carrusel_regionales/locro.png') }}"
            },
            {
                nombre: "Llama al Malbec",
                nombreCorto: "Llama al Malbec",
                imagen: "{{ url_for('static', filename='carrusel_regionales/llama_malbec.png') }}"
            },
            {
                nombre: "Asado de cabrito o cordero",
                nombreCorto: "Asado",
                imagen: "{{ url_for('static', filename='carrusel_regionales/asado_cabrito_cordero.png') }}"
            },
            {
                nombre: "Cazuela de llama",
                nombreCorto: "Cazuela llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/cazuela_llama.png') }}"
            },
            {
                nombre: "Cazuela de cordero",
                nombreCorto: "Cazuela cordero",
                imagen: "{{ url_for('static', filename='carrusel_regionales/cazuela_cordero.png') }}"
            },
            {
                nombre: "Cazuela de cabrito",
                nombreCorto: "Cazuela cabrito",
                imagen: "{{ url_for('static', filename='carrusel_regionales/cazuela_cabrito.png') }}"
            },
            {
                nombre: "Lomo de llama a la salsa blanca",
                nombreCorto: "Lomo de llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/lomo_llama_salsa_blanca.png') }}"
            },
            {
                nombre: "Medallón de quinoa",
                nombreCorto: "Medallón quinoa",
                imagen: "{{ url_for('static', filename='carrusel_regionales/medallon_quinoa.png') }}"
            },
            {
                nombre: "Milanesa de quesillo",
                nombreCorto: "Milanesa quesillo",
                imagen: "{{ url_for('static', filename='carrusel_regionales/milanesa_quesillo.png') }}"
            },
            {
                nombre: "Milanesa de llama",
                nombreCorto: "Milanesa llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/milanesa_llama.png') }}"
            },
            {
                nombre: "Napolitana de llama",
                nombreCorto: "Napolitana llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/napolitana_llama.png') }}"
            },
            {
                nombre: "Milanesa de llama a caballo",
                nombreCorto: "Llama a caballo",
                imagen: "{{ url_for('static', filename='carrusel_regionales/milanesa_llama_caballo.png') }}"
            }
        ];

        const carrusel =
            document.getElementById("carrusel");

        const imagenPrincipal =
            document.getElementById("imagenPrincipal");

        const nombrePlato =
            document.getElementById("nombrePlato");

        const lineaDorada =
            document.getElementById("lineaDorada");

        const contenedorMiniaturas =
            document.getElementById("miniaturas");

        const contenedorIndicadores =
            document.getElementById("indicadores");

        const botonAnterior =
            document.getElementById("anterior");

        const botonSiguiente =
            document.getElementById("siguiente");

        const botonPantallaCompleta =
            document.getElementById("botonPantallaCompleta");

        const mensajePantalla =
            document.getElementById("mensajePantalla");

        const cerrarMensaje =
            document.getElementById("cerrarMensaje");

        let indiceActual = 0;
        let temporizador;

        const duracion = 6500;

        /* PRECARGAR IMÁGENES */

        platos.forEach((plato) => {
            const imagen = new Image();
            imagen.src = plato.imagen;
        });

        /* CREAR MINIATURAS */

        function crearControles() {
            platos.forEach((plato, indice) => {

                const miniatura =
                    document.createElement("div");

                miniatura.className = "miniatura";
                miniatura.tabIndex = 0;

                if (indice === 0) {
                    miniatura.classList.add("activa");
                }

                miniatura.innerHTML = `
                    <img
                        class="miniatura-imagen"
                        src="${plato.imagen}"
                        alt="${plato.nombre}"
                    >

                    <span class="miniatura-nombre">
                        ${plato.nombreCorto}
                    </span>
                `;

                miniatura.addEventListener("click", () => {
                    mostrarPlato(indice);
                    reiniciarTemporizador();
                });

                miniatura.addEventListener("keydown", (evento) => {
                    if (
                        evento.key === "Enter" ||
                        evento.key === " "
                    ) {
                        mostrarPlato(indice);
                        reiniciarTemporizador();
                    }
                });

                contenedorMiniaturas.appendChild(miniatura);

                const punto =
                    document.createElement("button");

                punto.className = "punto";
                punto.type = "button";

                if (indice === 0) {
                    punto.classList.add("activo");
                }

                punto.setAttribute(
                    "aria-label",
                    `Mostrar ${plato.nombre}`
                );

                punto.addEventListener("click", () => {
                    mostrarPlato(indice);
                    reiniciarTemporizador();
                });

                contenedorIndicadores.appendChild(punto);
            });
        }

        /* REINICIAR ANIMACIONES */

        function reiniciarAnimaciones() {
            imagenPrincipal.classList.remove("animando");
            nombrePlato.classList.remove("animando");
            lineaDorada.classList.remove("animando");

            void imagenPrincipal.offsetWidth;

            imagenPrincipal.classList.add("animando");
            nombrePlato.classList.add("animando");
            lineaDorada.classList.add("animando");
        }

        /* MOSTRAR PLATO */

        function mostrarPlato(nuevoIndice) {
            const miniaturas =
                document.querySelectorAll(".miniatura");

            const puntos =
                document.querySelectorAll(".punto");

            indiceActual =
                (nuevoIndice + platos.length) %
                platos.length;

            imagenPrincipal.style.opacity = "0";

            setTimeout(() => {
                imagenPrincipal.src =
                    platos[indiceActual].imagen;

                imagenPrincipal.alt =
                    platos[indiceActual].nombre;

                nombrePlato.textContent =
                    platos[indiceActual].nombre;

                miniaturas.forEach((miniatura) => {
                    miniatura.classList.remove("activa");
                });

                puntos.forEach((punto) => {
                    punto.classList.remove("activo");
                });

                miniaturas[indiceActual]
                    .classList.add("activa");

                puntos[indiceActual]
                    .classList.add("activo");

                miniaturas[indiceActual].scrollIntoView({
                    behavior: "smooth",
                    block: "nearest",
                    inline: "center"
                });

                reiniciarAnimaciones();

                imagenPrincipal.style.opacity = "1";

            }, 350);
        }

        function siguientePlato() {
            mostrarPlato(indiceActual + 1);
        }

        function anteriorPlato() {
            mostrarPlato(indiceActual - 1);
        }

        /* TEMPORIZADOR */

        function iniciarTemporizador() {
            detenerTemporizador();

            temporizador = setInterval(
                siguientePlato,
                duracion
            );
        }

        function detenerTemporizador() {
            if (temporizador) {
                clearInterval(temporizador);
            }
        }

        function reiniciarTemporizador() {
            iniciarTemporizador();
        }

        botonSiguiente.addEventListener("click", () => {
            siguientePlato();
            reiniciarTemporizador();
        });

        botonAnterior.addEventListener("click", () => {
            anteriorPlato();
            reiniciarTemporizador();
        });

        document.addEventListener("keydown", (evento) => {
            if (evento.key === "ArrowRight") {
                siguientePlato();
                reiniciarTemporizador();
            }

            if (evento.key === "ArrowLeft") {
                anteriorPlato();
                reiniciarTemporizador();
            }

            if (
                evento.key === "f" ||
                evento.key === "F"
            ) {
                activarPantallaCompleta();
            }
        });

        /* PANTALLA COMPLETA */

        function estaEnPantallaCompleta() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement
            );
        }

        async function activarPantallaCompleta() {
            try {
                if (carrusel.requestFullscreen) {
                    await carrusel.requestFullscreen();

                } else if (carrusel.webkitRequestFullscreen) {
                    carrusel.webkitRequestFullscreen();

                } else if (carrusel.msRequestFullscreen) {
                    carrusel.msRequestFullscreen();

                } else {
                    mensajePantalla.classList.add("visible");
                }

            } catch (error) {
                mensajePantalla.classList.add("visible");
            }
        }

        function actualizarBotonPantallaCompleta() {
            if (estaEnPantallaCompleta()) {
                botonPantallaCompleta.classList.add("oculto");
            } else {
                botonPantallaCompleta.classList.remove("oculto");
            }
        }

        botonPantallaCompleta.addEventListener(
            "click",
            activarPantallaCompleta
        );

        document.addEventListener(
            "fullscreenchange",
            actualizarBotonPantallaCompleta
        );

        document.addEventListener(
            "webkitfullscreenchange",
            actualizarBotonPantallaCompleta
        );

        document.addEventListener(
            "MSFullscreenChange",
            actualizarBotonPantallaCompleta
        );

        cerrarMensaje.addEventListener("click", () => {
            mensajePantalla.classList.remove("visible");
        });

        /* INICIAR */

        crearControles();
        iniciarTemporizador();
    </script>

</body>

</html>
