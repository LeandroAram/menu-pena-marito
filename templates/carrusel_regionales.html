<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Platos Regionales - La Peña de Marito</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #090705;

            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font-family: inherit;
        }

        /* =========================================
           CARRUSEL GENERAL
        ========================================= */

        .carrusel {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #090705;
        }

        /* =========================================
           FONDO DESENFOCADO
        ========================================= */

        .fondo-desenfocado {
            position: absolute;
            inset: -25px;

            width: calc(100% + 50px);
            height: calc(100% + 50px);

            object-fit: cover;
            object-position: center;

            filter:
                blur(22px)
                brightness(0.45)
                saturate(1.15);

            transform: scale(1.08);

            opacity: 1;

            transition: opacity 0.8s ease;
        }

        /* =========================================
           IMAGEN PRINCIPAL
        ========================================= */

        .contenedor-imagen {
            position: absolute;
            top: 0;
            right: 0;

            width: 72%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                4vh
                3vw
                8vh
                1vw;

            overflow: hidden;
        }

        .imagen-principal {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center;

            opacity: 1;

            filter:
                drop-shadow(
                    0 20px 35px rgba(0, 0, 0, 0.55)
                );

            transition: opacity 0.8s ease;
        }

        .imagen-principal.animando {
            animation:
                movimientoPlato
                8s
                ease-out
                forwards;
        }

        @keyframes movimientoPlato {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.035);
            }
        }

        /* =========================================
           SOMBRAS DEL DISEÑO
        ========================================= */

        .capa-oscura {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(5, 3, 2, 0.98) 0%,
                    rgba(5, 3, 2, 0.94) 20%,
                    rgba(5, 3, 2, 0.72) 34%,
                    rgba(5, 3, 2, 0.12) 62%,
                    rgba(5, 3, 2, 0.04) 100%
                ),
                linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.62) 0%,
                    transparent 30%
                );
        }

        .capa-superior {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.56) 0%,
                    transparent 28%
                );
        }

        /* =========================================
           MARCA
        ========================================= */

        .marca {
            position: absolute;
            top: 34px;
            left: 55px;
            z-index: 20;

            color: white;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.9);
        }

        .marca-superior {
            display: block;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 21px;
            font-weight: bold;
        }

        .marca-principal {
            display: block;

            margin-top: -5px;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 52px;
            font-style: italic;
            font-weight: bold;
            line-height: 1;
        }

        .marca-lugar {
            display: block;

            margin-top: 8px;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* =========================================
           TÍTULO SUPERIOR
        ========================================= */

        .titulo-superior {
            position: absolute;
            top: 45px;
            right: 55px;
            z-index: 20;

            color: #efbd4d;

            font-size: 17px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.9);
        }

        .titulo-superior::after {
            content: "";

            display: block;

            width: 100%;
            height: 2px;

            margin-top: 11px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #efbd4d,
                    transparent
                );
        }

        /* =========================================
           INFORMACIÓN DEL PLATO
        ========================================= */

        .informacion {
            position: absolute;
            top: 50%;
            left: 8%;
            z-index: 20;

            width: min(560px, 37vw);

            transform: translateY(-50%);
        }

        .categoria {
            margin-bottom: 16px;

            color: #efbd4d;

            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nombre-plato {
            color: white;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 4.7vw, 73px);
            font-weight: bold;
            line-height: 1.05;

            text-shadow:
                0 4px 22px rgba(0, 0, 0, 0.95);
        }

        .nombre-plato.animando {
            animation:
                aparecerNombre
                1s
                ease
                forwards;
        }

        @keyframes aparecerNombre {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .linea-dorada {
            width: 130px;
            height: 4px;

            margin-top: 28px;

            background: #efbd4d;

            transform-origin: left;
        }

        .linea-dorada.animando {
            animation:
                aparecerLinea
                0.9s
                ease
                0.35s
                both;
        }

        @keyframes aparecerLinea {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* =========================================
           FLECHAS
        ========================================= */

        .flecha {
            position: absolute;
            top: 50%;
            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 68px;
            height: 68px;

            border: 2px solid #efbd4d;
            border-radius: 50%;

            color: #efbd4d;
            background: rgba(0, 0, 0, 0.34);

            font-size: 42px;
            line-height: 1;

            cursor: pointer;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transform: translateY(-50%);

            transition:
                color 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        .flecha:hover,
        .flecha:focus {
            color: #17100b;
            background: #efbd4d;

            transform:
                translateY(-50%)
                scale(1.08);

            outline: 4px solid white;
            outline-offset: 3px;
        }

        .flecha-anterior {
            left: 27px;
        }

        .flecha-siguiente {
            right: 27px;
        }

        /* =========================================
           BOTÓN DE PANTALLA COMPLETA
        ========================================= */

        .boton-pantalla-completa {
            position: absolute;
            top: 98px;
            right: 54px;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-width: 220px;
            min-height: 50px;

            padding: 12px 22px;

            border: 2px solid #efbd4d;
            border-radius: 28px;

            color: #efbd4d;
            background: rgba(0, 0, 0, 0.82);

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;

            cursor: pointer;

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .boton-pantalla-completa:hover,
        .boton-pantalla-completa:focus {
            color: #17100b;
            background: #efbd4d;

            transform: scale(1.05);

            outline: 4px solid white;
            outline-offset: 3px;
        }

        .boton-pantalla-completa.oculto {
            display: none;
        }

        /* =========================================
           CONTADOR INFERIOR
        ========================================= */

        .contador {
            position: absolute;
            right: 58px;
            bottom: 38px;
            z-index: 30;

            color: rgba(255, 255, 255, 0.82);

            font-size: 15px;
            font-weight: bold;
            letter-spacing: 3px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .contador-actual {
            color: #efbd4d;
            font-size: 25px;
        }

        /* =========================================
           PRESENTACIÓN INICIAL
        ========================================= */

        .presentacion {
            position: absolute;
            inset: 0;
            z-index: 500;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(8, 4, 2, 0.96),
                    rgba(35, 15, 5, 0.93)
                );

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        .presentacion.oculta {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .presentacion-fondo {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            filter:
                blur(15px)
                brightness(0.28)
                saturate(1.2);

            transform: scale(1.12);
        }

        .presentacion-capa {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(80, 35, 10, 0.30),
                    rgba(0, 0, 0, 0.90)
                );
        }

        .presentacion-contenido {
            position: relative;
            z-index: 5;

            width: 90%;

            color: white;
            text-align: center;
        }

        .presentacion-marca {
            margin-bottom: 27px;

            color: #efbd4d;

            font-size: 19px;
            font-weight: bold;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .presentacion-titulo {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(58px, 8vw, 125px);
            font-weight: bold;
            line-height: 1;

            text-shadow:
                0 8px 35px rgba(0, 0, 0, 0.95);

            animation:
                aparecerPresentacion
                1.2s
                ease
                forwards;
        }

        .presentacion-linea {
            width: 180px;
            height: 5px;

            margin: 32px auto 25px;

            background: #efbd4d;

            animation:
                lineaPresentacion
                1.1s
                ease
                0.35s
                both;
        }

        .presentacion-subtitulo {
            color: rgba(255, 255, 255, 0.86);

            font-size: clamp(18px, 2vw, 28px);
            letter-spacing: 5px;
            text-transform: uppercase;

            animation:
                aparecerPresentacion
                1.1s
                ease
                0.55s
                both;
        }

        @keyframes aparecerPresentacion {
            from {
                opacity: 0;
                transform: translateY(32px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineaPresentacion {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* =========================================
           MENSAJE PANTALLA COMPLETA
        ========================================= */

        .mensaje-pantalla {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 9999;

            display: none;

            width: min(520px, 85%);

            padding: 25px;

            border: 2px solid #efbd4d;
            border-radius: 18px;

            color: white;
            background: rgba(0, 0, 0, 0.95);

            text-align: center;
            font-size: 18px;
            line-height: 1.5;

            transform: translate(-50%, -50%);
        }

        .mensaje-pantalla.visible {
            display: block;
        }

        .cerrar-mensaje {
            margin-top: 18px;
            padding: 10px 25px;

            border: none;
            border-radius: 20px;

            color: #17100b;
            background: #efbd4d;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        /* =========================================
           PANTALLAS MEDIANAS
        ========================================= */

        @media (max-width: 1100px) {
            .contenedor-imagen {
                width: 68%;
            }

            .informacion {
                left: 9%;
                width: 40vw;
            }

            .nombre-plato {
                font-size: 46px;
            }
        }

        /* =========================================
           CELULARES
        ========================================= */

        @media (max-width: 700px) {
            .marca {
                top: 22px;
                left: 22px;
            }

            .marca-principal {
                font-size: 39px;
            }

            .titulo-superior {
                display: none;
            }

            .boton-pantalla-completa {
                top: 22px;
                right: 18px;

                min-width: auto;
                min-height: 43px;

                padding: 9px 14px;

                font-size: 11px;
            }

            .contenedor-imagen {
                top: 7%;
                right: 0;

                width: 100%;
                height: 61%;

                padding:
                    5vh
                    5vw
                    2vh;
            }

            .capa-oscura {
                background:
                    linear-gradient(
                        0deg,
                        rgba(0, 0, 0, 0.96) 0%,
                        rgba(0, 0, 0, 0.80) 34%,
                        transparent 70%
                    );
            }

            .informacion {
                top: auto;
                left: 11%;
                bottom: 10%;

                width: 78%;

                transform: none;
            }

            .nombre-plato {
                font-size: 39px;
            }

            .flecha {
                width: 50px;
                height: 50px;

                font-size: 30px;
            }

            .flecha-anterior {
                left: 10px;
            }

            .flecha-siguiente {
                right: 10px;
            }

            .contador {
                right: 22px;
                bottom: 20px;
            }

            .presentacion-titulo {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <main
        id="carrusel"
        class="carrusel"
    >

        <!-- FONDO DESENFOCADO -->

        <img
            id="fondoDesenfocado"
            class="fondo-desenfocado"
            src="{{ url_for('static', filename='carrusel_regionales/locro.png') }}"
            alt=""
        >

        <!-- IMAGEN COMPLETA DEL PLATO -->

        <div class="contenedor-imagen">

            <img
                id="imagenPrincipal"
                class="imagen-principal animando"
                src="{{ url_for('static', filename='carrusel_regionales/locro.png') }}"
                alt="Locro norteño"
            >

        </div>

        <!-- SOMBRAS -->

        <div class="capa-oscura"></div>
        <div class="capa-superior"></div>

        <!-- MARCA -->

        <div class="marca">

            <span class="marca-superior">
                La Peña de
            </span>

            <span class="marca-principal">
                Marito
            </span>

            <span class="marca-lugar">
                PURMAMARCA
            </span>

        </div>

        <!-- TÍTULO SUPERIOR -->

        <div class="titulo-superior">
            Sabores de nuestra tierra
        </div>

        <!-- PANTALLA COMPLETA -->

        <button
            id="botonPantallaCompleta"
            class="boton-pantalla-completa"
            type="button"
        >
            ⛶ PANTALLA COMPLETA
        </button>

        <!-- INFORMACIÓN DEL PLATO -->

        <section class="informacion">

            <p class="categoria">
                Plato regional
            </p>

            <h1
                id="nombrePlato"
                class="nombre-plato animando"
            >
                Locro norteño
            </h1>

            <div
                id="lineaDorada"
                class="linea-dorada animando"
            ></div>

        </section>

        <!-- FLECHAS -->

        <button
            id="anterior"
            class="flecha flecha-anterior"
            type="button"
            aria-label="Plato anterior"
        >
            ‹
        </button>

        <button
            id="siguiente"
            class="flecha flecha-siguiente"
            type="button"
            aria-label="Siguiente plato"
        >
            ›
        </button>

        <!-- CONTADOR -->

        <div class="contador">

            <span
                id="contadorActual"
                class="contador-actual"
            >
                01
            </span>

            <span>
                / 12
            </span>

        </div>

        <!-- PRESENTACIÓN DE 3 SEGUNDOS -->

        <section
            id="presentacion"
            class="presentacion"
        >

            <img
                class="presentacion-fondo"
                src="{{ url_for('static', filename='carrusel_regionales/locro.png') }}"
                alt=""
            >

            <div class="presentacion-capa"></div>

            <div class="presentacion-contenido">

                <p class="presentacion-marca">
                    La Peña de Marito · Purmamarca
                </p>

                <h1 class="presentacion-titulo">
                    Platos Regionales
                </h1>

                <div class="presentacion-linea"></div>

                <p class="presentacion-subtitulo">
                    Sabores auténticos de nuestra tierra
                </p>

            </div>

        </section>

    </main>

    <!-- MENSAJE SI LA TELE NO PERMITE PANTALLA COMPLETA -->

    <div
        id="mensajePantalla"
        class="mensaje-pantalla"
    >

        <p>
            Este navegador no permitió activar la pantalla completa.
        </p>

        <button
            id="cerrarMensaje"
            class="cerrar-mensaje"
            type="button"
        >
            Cerrar
        </button>

    </div>

    <script>
        const platos = [
            {
                nombre: "Locro norteño",
                imagen: "{{ url_for('static', filename='carrusel_regionales/locro.png') }}"
            },
            {
                nombre: "Llama al Malbec",
                imagen: "{{ url_for('static', filename='carrusel_regionales/llama_malbec.png') }}"
            },
            {
                nombre: "Asado de cabrito o cordero",
                imagen: "{{ url_for('static', filename='carrusel_regionales/asado_cabrito_cordero.png') }}"
            },
            {
                nombre: "Cazuela de llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/cazuela_llama.png') }}"
            },
            {
                nombre: "Cazuela de cordero",
                imagen: "{{ url_for('static', filename='carrusel_regionales/cazuela_cordero.png') }}"
            },
            {
                nombre: "Cazuela de cabrito",
                imagen: "{{ url_for('static', filename='carrusel_regionales/cazuela_cabrito.png') }}"
            },
            {
                nombre: "Lomo de llama a la salsa blanca",
                imagen: "{{ url_for('static', filename='carrusel_regionales/lomo_llama_salsa_blanca.png') }}"
            },
            {
                nombre: "Medallón de quinoa",
                imagen: "{{ url_for('static', filename='carrusel_regionales/medallon_quinoa.png') }}"
            },
            {
                nombre: "Milanesa de quesillo",
                imagen: "{{ url_for('static', filename='carrusel_regionales/milanesa_quesillo.png') }}"
            },
            {
                nombre: "Milanesa de llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/milanesa_llama.png') }}"
            },
            {
                nombre: "Napolitana de llama",
                imagen: "{{ url_for('static', filename='carrusel_regionales/napolitana_llama.png') }}"
            },
            {
                nombre: "Milanesa de llama a caballo",
                imagen: "{{ url_for('static', filename='carrusel_regionales/milanesa_llama_caballo.png') }}"
            }
        ];

        const carrusel =
            document.getElementById("carrusel");

        const presentacion =
            document.getElementById("presentacion");

        const fondoDesenfocado =
            document.getElementById("fondoDesenfocado");

        const imagenPrincipal =
            document.getElementById("imagenPrincipal");

        const nombrePlato =
            document.getElementById("nombrePlato");

        const lineaDorada =
            document.getElementById("lineaDorada");

        const contadorActual =
            document.getElementById("contadorActual");

        const botonAnterior =
            document.getElementById("anterior");

        const botonSiguiente =
            document.getElementById("siguiente");

        const botonPantallaCompleta =
            document.getElementById("botonPantallaCompleta");

        const mensajePantalla =
            document.getElementById("mensajePantalla");

        const cerrarMensaje =
            document.getElementById("cerrarMensaje");

        let indiceActual = 0;
        let temporizadorPlato;
        let temporizadorPresentacion;

        const duracionPresentacion = 3000;
        const duracionPlato = 8000;


        /* =========================================
           PRECARGAR LAS IMÁGENES
        ========================================= */

        platos.forEach((plato) => {
            const imagen = new Image();
            imagen.src = plato.imagen;
        });


        /* =========================================
           REINICIAR ANIMACIONES
        ========================================= */

        function reiniciarAnimaciones() {
            imagenPrincipal.classList.remove("animando");
            nombrePlato.classList.remove("animando");
            lineaDorada.classList.remove("animando");

            void imagenPrincipal.offsetWidth;

            imagenPrincipal.classList.add("animando");
            nombrePlato.classList.add("animando");
            lineaDorada.classList.add("animando");
        }


        /* =========================================
           MOSTRAR UN PLATO
        ========================================= */

        function mostrarPlato(nuevoIndice) {
            indiceActual =
                (nuevoIndice + platos.length) %
                platos.length;

            imagenPrincipal.style.opacity = "0";
            fondoDesenfocado.style.opacity = "0";

            setTimeout(() => {
                const plato = platos[indiceActual];

                imagenPrincipal.src = plato.imagen;
                imagenPrincipal.alt = plato.nombre;

                fondoDesenfocado.src = plato.imagen;

                nombrePlato.textContent = plato.nombre;

                contadorActual.textContent =
                    String(indiceActual + 1).padStart(2, "0");

                reiniciarAnimaciones();

                imagenPrincipal.style.opacity = "1";
                fondoDesenfocado.style.opacity = "1";

            }, 400);
        }


        /* =========================================
           PRESENTACIÓN INICIAL
        ========================================= */

        function mostrarPresentacion() {
            detenerTemporizadores();

            presentacion.classList.remove("oculta");

            temporizadorPresentacion = setTimeout(() => {
                presentacion.classList.add("oculta");

                indiceActual = 0;
                mostrarPlato(0);

                iniciarTemporizadorPlato();

            }, duracionPresentacion);
        }


        /* =========================================
           CAMBIO AUTOMÁTICO
        ========================================= */

        function siguientePlatoAutomatico() {
            if (indiceActual === platos.length - 1) {
                mostrarPresentacion();
                return;
            }

            mostrarPlato(indiceActual + 1);
        }


        function iniciarTemporizadorPlato() {
            detenerTemporizadorPlato();

            temporizadorPlato = setInterval(
                siguientePlatoAutomatico,
                duracionPlato
            );
        }


        function detenerTemporizadorPlato() {
            if (temporizadorPlato) {
                clearInterval(temporizadorPlato);
            }
        }


        function detenerTemporizadores() {
            detenerTemporizadorPlato();

            if (temporizadorPresentacion) {
                clearTimeout(temporizadorPresentacion);
            }
        }


        function reiniciarTemporizadorPlato() {
            iniciarTemporizadorPlato();
        }


        /* =========================================
           BOTONES DE SIGUIENTE Y ANTERIOR
        ========================================= */

        botonSiguiente.addEventListener("click", () => {
            presentacion.classList.add("oculta");

            mostrarPlato(indiceActual + 1);
            reiniciarTemporizadorPlato();
        });


        botonAnterior.addEventListener("click", () => {
            presentacion.classList.add("oculta");

            mostrarPlato(indiceActual - 1);
            reiniciarTemporizadorPlato();
        });


        document.addEventListener("keydown", (evento) => {
            if (evento.key === "ArrowRight") {
                presentacion.classList.add("oculta");

                mostrarPlato(indiceActual + 1);
                reiniciarTemporizadorPlato();
            }

            if (evento.key === "ArrowLeft") {
                presentacion.classList.add("oculta");

                mostrarPlato(indiceActual - 1);
                reiniciarTemporizadorPlato();
            }

            if (
                evento.key === "f" ||
                evento.key === "F"
            ) {
                activarPantallaCompleta();
            }
        });


        /* =========================================
           PANTALLA COMPLETA
        ========================================= */

        function estaEnPantallaCompleta() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement
            );
        }


        async function activarPantallaCompleta() {
            try {
                if (carrusel.requestFullscreen) {
                    await carrusel.requestFullscreen();

                } else if (carrusel.webkitRequestFullscreen) {
                    carrusel.webkitRequestFullscreen();

                } else if (carrusel.msRequestFullscreen) {
                    carrusel.msRequestFullscreen();

                } else {
                    mensajePantalla.classList.add("visible");
                }

            } catch (error) {
                mensajePantalla.classList.add("visible");
            }
        }


        function actualizarBotonPantallaCompleta() {
            if (estaEnPantallaCompleta()) {
                botonPantallaCompleta.classList.add("oculto");
            } else {
                botonPantallaCompleta.classList.remove("oculto");
            }
        }


        botonPantallaCompleta.addEventListener(
            "click",
            activarPantallaCompleta
        );


        document.addEventListener(
            "fullscreenchange",
            actualizarBotonPantallaCompleta
        );


        document.addEventListener(
            "webkitfullscreenchange",
            actualizarBotonPantallaCompleta
        );


        document.addEventListener(
            "MSFullscreenChange",
            actualizarBotonPantallaCompleta
        );


        cerrarMensaje.addEventListener("click", () => {
            mensajePantalla.classList.remove("visible");
        });


        /* =========================================
           INICIAR EL CARRUSEL
        ========================================= */

        mostrarPresentacion();
    </script>

</body>

</html>
