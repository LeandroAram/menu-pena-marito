<!DOCTYPE html>
<html>

<head>

    <title>Categorías</title>

    <style>

        body{
            margin:0;
            padding:20px;
            background:#f5e6c8;
            font-family:Arial;
        }

        h1{
            text-align:center;
            color:#8b4513;
            font-size:50px;
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
        }

        .categoria-img{
            position:relative;
            margin-bottom:25px;
            overflow:hidden;
            border-radius:20px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.3);

            opacity:0;
            transform:translateY(30px);
            animation:aparecer 0.7s forwards;
        }

        .categoria-img:nth-of-type(1){
            animation-delay:0.1s;
        }

        .categoria-img:nth-of-type(2){
            animation-delay:0.2s;
        }

        .categoria-img:nth-of-type(3){
            animation-delay:0.3s;
        }

        .categoria-img:nth-of-type(4){
            animation-delay:0.4s;
        }

        .categoria-img:nth-of-type(5){
            animation-delay:0.5s;
        }

        .categoria-img:nth-of-type(6){
            animation-delay:0.6s;
        }

        .categoria-img:nth-of-type(7){
            animation-delay:0.7s;
        }

        .categoria-img:nth-of-type(8){
            animation-delay:0.8s;
        }

        @keyframes aparecer{

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .categoria-img img{
            width:100%;
            height:230px;
            object-fit:cover;
            display:block;
        }

        .overlay{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.45);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:38px;
            font-weight:bold;
            text-align:center;
        }

        .volver{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:#8b4513;
            color:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <a href="/" class="volver">
        ← Volver
    </a>

    <h1>🍽️ Categorías</h1>

    <a href="/regionales">

        <div class="categoria-img">

            <img src="/static/categorias/regionales.jpg">

            <div class="overlay">

                🦙 Platos Regionales

            </div>

        </div>

    </a>

    <a href="/tradicionales">

        <div class="categoria-img">

            <img src="/static/categorias/tradicionales.jpg">

            <div class="overlay">

                🍽️ Platos Tradicionales

            </div>

        </div>

    </a>

    <a href="/pastas">

        <div class="categoria-img">

            <img src="/static/categorias/pastas.jpg">

            <div class="overlay">

                🍝 Pastas

            </div>

        </div>

    </a>

    <a href="/entradas">

        <div class="categoria-img">

            <img src="/static/categorias/entradas.jpg">

            <div class="overlay">

                🥟 Entradas

            </div>

        </div>

    </a>

    <a href="/postres">

        <div class="categoria-img">

            <img src="/static/categorias/postres.jpg">

            <div class="overlay">

                🍰 Postres

            </div>

        </div>

    </a>

    <a href="/bebidas">

        <div class="categoria-img">

            <img src="/static/categorias/bebidas.jpg">

            <div class="overlay">

                🥤 Bebidas

            </div>

        </div>

    </a>

    <a href="/cervezas">

        <div class="categoria-img">

            <img src="/static/categorias/cervezas.jpg">

            <div class="overlay">

                🍺 Cervezas

            </div>

        </div>

    </a>

    <a href="/vinos">

        <div class="categoria-img">

            <img src="/static/categorias/vinos.jpg">

            <div class="overlay">

                🍷 Vinos

            </div>

        </div>

    </a>

</body>

</html>
