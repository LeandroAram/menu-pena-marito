        .categoria-img{

        .categoria-img img{

            height:230px;

        }

        .overlay{
            position:absolute;

            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.45);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:38px;
            font-weight:bold;
            text-align:center;
        }

        .volver{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:#8b4513;
            color:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:bold;
        }

</head>
