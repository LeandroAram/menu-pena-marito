<!DOCTYPE html>
<html>

<head>

    <title>Categorías</title>

    <style>

        body{
            margin:0;
            padding:20px;
            background:#f5e6c8;
            font-family:Arial;
        }

        h1{
            text-align:center;
            color:#8b4513;
            font-size:50px;
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
        }

        .categoria-img{
            position:relative;
            margin-bottom:25px;
            overflow:hidden;
            border-radius:20px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.3);

            opacity:0;
        }

        .categoria-img img{
            width:100%;
            height:230px;
            object-fit:cover;
            display:block;
        }

        .overlay{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.45);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:38px;
            font-weight:bold;
            text-align:center;
        }

        .volver{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:#8b4513;
            color:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:bold;
        }

        /* ANIMACIONES */

        .izquierda{
            animation:izquierda 1s forwards;
        }

        .derecha{
            animation:derecha 1s forwards;
        }

        .delay1{
            animation-delay:0.2s;
        }

        .delay2{
            animation-delay:0.5s;
        }

        .delay3{
            animation-delay:0.8s;
        }

        .delay4{
            animation-delay:1.1s;
        }

        .delay5{
            animation-delay:1.4s;
        }

        .delay6{
            animation-delay:1.7s;
        }

        .delay7{
            animation-delay:2s;
        }

        .delay8{
            animation-delay:2.3s;
        }

        @keyframes izquierda{

            from{
                opacity:0;
                transform:translateX(-120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        @keyframes derecha{

            from{
                opacity:0;
                transform:translateX(120px);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

    </style>

</head>

<body>

    <a href="/" class="volver">
        ← Volver
    </a>

    <h1>🍽️ Categorías</h1>

    <a href="/regionales">

        <div class="categoria-img izquierda delay1">

            <img src="/static/categorias/regionales.jpg">

            <div class="overlay">

                🦙 Platos Regionales

            </div>

        </div>

    </a>

    <a href="/tradicionales">

        <div class="categoria-img derecha delay2">

            <img src="/static/categorias/tradicionales.jpg">

            <div class="overlay">

                🍽️ Platos Tradicionales

            </div>

        </div>

    </a>

    <a href="/pastas">

        <div class="categoria-img izquierda delay3">

            <img src="/static/categorias/pastas.jpg">

            <div class="overlay">

                🍝 Pastas

            </div>

        </div>

    </a>

    <a href="/entradas">

        <div class="categoria-img derecha delay4">

            <img src="/static/categorias/entradas.jpg">

            <div class="overlay">

                🥟 Entradas

            </div>

        </div>

    </a>

    <a href="/postres">

        <div class="categoria-img izquierda delay5">

            <img src="/static/categorias/postres.jpg">

            <div class="overlay">

                🍰 Postres

            </div>

        </div>

    </a>

    <a href="/bebidas">

        <div class="categoria-img derecha delay6">

            <img src="/static/categorias/bebidas.jpg">

            <div class="overlay">

                🥤 Bebidas

            </div>

        </div>

    </a>

    <a href="/cervezas">

        <div class="categoria-img izquierda delay7">

            <img src="/static/categorias/cervezas.jpg">

            <div class="overlay">

                🍺 Cervezas

            </div>

        </div>

    </a>

    <a href="/vinos">

        <div class="categoria-img derecha delay8">

            <img src="/static/categorias/vinos.jpg">

            <div class="overlay">

                🍷 Vinos

            </div>

        </div>

    </a>

body{
    margin:0;
    padding:20px;
    background:#f5e6c8;
    font-family:Arial;
    overflow-x:hidden;
}

</html>
